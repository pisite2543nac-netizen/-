['ระเบียบบริษัทให้ทำงานล่วงเวลาโดยไม่จ่ายค่าตอบแทน ซึ่งขัดกับกฎหมายคุ้มครองแรงงาน ผลเป็นอย่างไร',['บังคับใช้ได้เพราะพนักงานเซ็นรับทราบระเบียบแล้ว','บังคับใช้ได้เพราะระเบียบบริษัทเป็นกฎหมายเฉพาะกิจการ','บังคับใช้ได้เมื่อผู้บริหารส่วนใหญ่ของบริษัทเห็นชอบ','บังคับใช้ไม่ได้ในส่วนที่ขัดกับกฎหมายที่ศักดิ์สูงกว่า','บังคับใช้ได้ตราบใดที่ยังไม่มีพนักงานคนใดร้องเรียน']],
['ข้อใดเรียงลำดับศักดิ์ของกฎหมายจากสูงไปต่ำได้ถูกต้อง',['รัฐธรรมนูญ → พ.ร.บ. → พระราชกฤษฎีกา → กฎกระทรวง → ข้อบัญญัติท้องถิ่น','พ.ร.บ. → รัฐธรรมนูญ → กฎกระทรวง → พระราชกฤษฎีกา → ข้อบัญญัติท้องถิ่น','รัฐธรรมนูญ → กฎกระทรวง → พ.ร.บ. → ข้อบัญญัติท้องถิ่น → พระราชกฤษฎีกา','รัฐธรรมนูญ → พ.ร.บ. → กฎกระทรวง → พระราชกฤษฎีกา → ข้อบัญญัติท้องถิ่น','ข้อบัญญัติท้องถิ่น → กฎกระทรวง → พระราชกฤษฎีกา → พ.ร.บ. → รัฐธรรมนูญ']],
['มีการออกกฎหมายห้ามพฤติกรรมหนึ่งในปีนี้ แต่มีผู้ทำพฤติกรรมนั้นเมื่อปีก่อน ศาลจะลงโทษได้หรือไม่',['ลงโทษได้เพราะพฤติกรรมนั้นไม่เหมาะสมต่อสังคม','ลงโทษได้เพราะผู้กระทำควรคาดได้ว่าจะมีกฎหมาย','ลงโทษได้หากความเสียหายที่เกิดขึ้นมีมูลค่าสูงมาก','ลงโทษได้ถ้าประชาชนส่วนใหญ่เรียกร้องให้ลงโทษ','ลงโทษไม่ได้ เพราะกฎหมายอาญาไม่มีผลย้อนหลังเป็นโทษ']],
['ข้อใดแสดงความแตกต่างระหว่างกฎหมายกับจริยธรรมได้ชัดเจนที่สุด',['ทั้งสองอย่างมีโทษจำคุกที่ศาลเป็นผู้กำหนดเหมือนกัน','จริยธรรมมีศักดิ์สูงกว่ารัฐธรรมนูญจึงบังคับใช้ได้เสมอ','กฎหมายมีรัฐบังคับพร้อมบทลงโทษ จริยธรรมเป็นมาตรฐานสังคม','กฎหมายเป็นเรื่องของรัฐ ส่วนจริยธรรมเป็นเรื่องของศาสนาเท่านั้น','จริยธรรมใช้กับนักศึกษา ส่วนกฎหมายใช้กับครูอาจารย์เท่านั้น']],
['นักศึกษาฝึกงานถ่ายภาพหน้าจอระบบภายในของลูกค้าไปโพสต์ ทั้งที่มีสัญญารักษาความลับ ผลเป็นอย่างไร',['อาจต้องรับผิดตามสัญญาและกฎหมายอื่นที่เกี่ยวข้อง','ไม่ผิดเพราะเป็นเพียงนักศึกษาที่ยังไม่มีรายได้ประจำ','ไม่ผิดเพราะโพสต์ในบัญชีส่วนตัวไม่ใช่บัญชีบริษัท','ไม่ผิดเพราะไม่ได้นำภาพไปขายหรือหากำไรโดยตรง','ผิดเฉพาะเมื่อมีผู้กดไลก์โพสต์เกินหนึ่งพันคนขึ้นไป']],
['ลูกค้าสั่งให้ติดตั้งโปรแกรมละเมิดลิขสิทธิ์ทั้งออฟฟิศ ผู้ประกอบวิชาชีพไอทีควรทำอย่างไร',['ติดตั้งให้ตามคำสั่งเพราะลูกค้าเป็นผู้จ่ายเงินจ้าง','ติดตั้งให้แต่เก็บหลักฐานไว้ว่าลูกค้าเป็นผู้สั่งการ','ติดตั้งให้เฉพาะเครื่องที่ใช้งานจริงเพื่อลดความเสียหาย','เงียบไว้และปล่อยให้ลูกค้าตัดสินใจเองทุกขั้นตอน','ปฏิเสธพร้อมอธิบายความเสี่ยงและเสนอทางเลือกถูกกฎหมาย']],
['หลัก "ไม่มีความผิด ไม่มีโทษ โดยไม่มีกฎหมาย" หมายความว่าอย่างไร',['ศาลลงโทษได้ทุกการกระทำที่สังคมเห็นว่าไม่เหมาะสม','ศาลลงโทษได้เฉพาะการกระทำที่กฎหมายบัญญัติเป็นความผิดไว้ก่อน','ศาลลงโทษได้เมื่อผู้เสียหายร้องขอแม้ไม่มีกฎหมายกำหนด','ศาลลงโทษได้ตามความเห็นส่วนตัวของผู้พิพากษาแต่ละท่าน','ศาลลงโทษได้เมื่อพฤติกรรมนั้นเคยเกิดขึ้นในต่างประเทศ']],
['ข้อบัญญัติของ อบต. ขัดกับ พ.ร.บ. ที่ออกโดยรัฐสภา ผลเป็นอย่างไร',['ใช้ข้อบัญญัติเพราะใกล้ชิดกับประชาชนในพื้นที่มากกว่า','ใช้ทั้งสองฉบับพร้อมกันโดยเลือกตามความสะดวกของผู้ใช้','ใช้ฉบับที่ประกาศทีหลังโดยไม่ต้องคำนึงถึงศักดิ์ของกฎหมาย','ใช้ พ.ร.บ. เพราะศักดิ์สูงกว่า ส่วนที่ขัดของข้อบัญญัติใช้ไม่ได้','ยกเลิกทั้งสองฉบับแล้วรอให้มีกฎหมายใหม่ออกมาใช้แทนกัน']],
['เหตุผลสำคัญที่สุดที่ผู้ประกอบวิชาชีพไอทีต้องรู้กฎหมายในงานของตนคือข้อใด',['เพื่อใช้เป็นช่องทางหาประโยชน์จากลูกค้าที่ไม่รู้กฎหมาย','เพื่อหลีกเลี่ยงการทำงานร่วมกับหน่วยงานของรัฐทั้งหมด','เพื่อป้องกันความเสี่ยงทางกฎหมายของตน ลูกค้า และองค์กร','เพื่อให้สามารถตัดสินคดีแทนศาลได้เมื่อเกิดข้อพิพาท','เพื่อใช้อ้างว่าไม่ต้องรับผิดชอบทุกครั้งที่งานเกิดปัญหา']]
]}};

C[2]={
art:['พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ พ.ศ. 2550 เป็นกฎหมายหลักที่กำหนดความผิดและโทษเกี่ยวกับการใช้ระบบคอมพิวเตอร์ ต่อมามีการแก้ไขโดยฉบับที่ 2 พ.ศ. 2560 ซึ่งมีผลใช้บังคับตั้งแต่วันที่ 24 พฤษภาคม 2560 โดยทั้งสองฉบับใช้บังคับควบคู่กัน ผู้ประกอบวิชาชีพไอทีควรตรวจสอบฉบับล่าสุดจากราชกิจจานุเบกษาเสมอ','ความผิดกลุ่มแรกเกี่ยวกับการเข้าถึงระบบและข้อมูล มาตรา 5 คือการเข้าถึงระบบคอมพิวเตอร์ที่มีมาตรการป้องกันโดยมิชอบ โทษจำคุกไม่เกิน 6 เดือน หรือปรับไม่เกิน 10,000 บาท มาตรา 6 คือการล่วงรู้มาตรการป้องกัน เช่น รหัสผ่าน แล้วนำไปเปิดเผยโดยมิชอบ และมาตรา 7 คือการเข้าถึงข้อมูลคอมพิวเตอร์ที่มีมาตรการป้องกันโดยมิชอบ','ความผิดกลุ่มที่สองคือการดักรับ ทำลาย และรบกวน มาตรา 8 ห้ามดักรับข้อมูลคอมพิวเตอร์ของผู้อื่นที่อยู่ระหว่างส่ง มาตรา 9 ห้ามทำให้เสียหาย ทำลาย แก้ไข หรือเพิ่มเติมข้อมูลของผู้อื่น มาตรา 10 ห้ามกระทำให้ระบบของผู้อื่นทำงานผิดปกติหรือหยุดชะงัก เช่น การโจมตีให้ระบบล่ม มาตรา 11 ห้ามส่งข้อมูลรบกวนโดยปกปิดหรือปลอมแหล่งที่มา และมาตรา 13 ห้ามจำหน่ายหรือเผยแพร่ชุดคำสั่งที่ใช้เป็นเครื่องมือกระทำความผิด','ความผิดเกี่ยวกับเนื้อหา มาตรา 14 ห้ามนำเข้าข้อมูลคอมพิวเตอร์ปลอมหรือเท็จโดยทุจริตหรือหลอกลวง ที่น่าจะเกิดความเสียหายต่อผู้อื่นหรือประชาชน รวมถึงข้อมูลเท็จที่ก่อให้เกิดความเสียหายต่อความมั่นคงหรือเศรษฐกิจ หรือก่อให้เกิดความตื่นตระหนก โทษจำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ ส่วนมาตรา 16 เกี่ยวกับการนำภาพของผู้อื่นที่ตัดต่อหรือดัดแปลงไปเผยแพร่จนทำให้เสียชื่อเสียง ถูกดูหมิ่น เกลียดชัง หรืออับอาย','หน้าที่ของผู้ให้บริการ มาตรา 26 กำหนดให้ผู้ให้บริการต้องเก็บข้อมูลจราจรทางคอมพิวเตอร์ไว้ไม่น้อยกว่า 90 วัน นับแต่วันที่ข้อมูลนั้นเข้าสู่ระบบ ข้อมูลจราจรคือข้อมูลเกี่ยวกับการติดต่อสื่อสาร เช่น ต้นทาง ปลายทาง เวลา และประเภทบริการ เพื่อให้สามารถสืบหาผู้กระทำความผิดได้ นอกจากนี้ ผู้ให้บริการที่จงใจสนับสนุนหรือยินยอมให้มีการกระทำความผิดอาจต้องรับโทษเช่นเดียวกับผู้กระทำ','แนวปฏิบัติสำหรับผู้ประกอบวิชาชีพไอที คือ เข้าระบบเฉพาะเมื่อได้รับอนุญาต ไม่แชร์หรือเปิดเผยรหัสผ่าน กำหนดสิทธิ์ตามหน้าที่ เก็บบันทึกการเข้าใช้งาน และขอหนังสืออนุญาตเป็นลายลักษณ์อักษรก่อนทดสอบเจาะระบบทุกครั้ง'],
ws:['สรุปความผิดตามมาตรา 5, 6 และ 7 และอธิบายความแตกต่างของแต่ละมาตราด้วยคำพูดของตนเอง','ยกตัวอย่างสถานการณ์จริงที่อาจผิดตามมาตรา 14 และมาตรา 16 อย่างละ 1 กรณี พร้อมอธิบายเหตุผล','อธิบายหน้าที่ของผู้ให้บริการเกี่ยวกับการเก็บข้อมูลจราจร (ระยะเวลาและความหมาย) และเหตุผลที่กฎหมายกำหนด','วิเคราะห์กรณี: นักศึกษาแอบจำรหัสผ่านของเพื่อนแล้วล็อกอินเข้าบัญชีระบบเรียนออนไลน์ของเพื่อนโดยไม่ได้รับอนุญาต เป็นความผิดหรือไม่ มาตราใด เพราะเหตุใด','เสนอแนวปฏิบัติอย่างน้อย 5 ข้อ สำหรับผู้ดูแลระบบ เพื่อไม่ให้ตนเองกระทำผิดและเพื่อป้องกันองค์กร'],
ex:[
['ข้อใดเป็นการเข้าถึงระบบคอมพิวเตอร์โดยมิชอบตามมาตรา 5',['ใช้โน้ตบุ๊กของตนเองเปิดดูไฟล์ที่ตนเองสร้างไว้','ใช้รหัสผ่านที่ได้มาแอบเข้าระบบของบริษัทโดยไม่ได้รับอนุญาต','เปิดเว็บไซต์ของหน่วยงานที่เปิดให้ประชาชนเข้าชมทั่วไป','ล็อกอินบัญชีของตนเองด้วยรหัสผ่านที่ตนตั้งไว้เอง','ใช้คอมพิวเตอร์ห้องเรียนตามที่ครูอนุญาตให้ใช้งาน']],
['การล่วงรู้รหัสผ่านของผู้อื่นแล้วเปิดเผยโดยมิชอบ เป็นความผิดตามมาตราใด',['มาตรา 5 การเข้าถึงระบบคอมพิวเตอร์โดยมิชอบ','มาตรา 9 การทำลายข้อมูลคอมพิวเตอร์ของผู้อื่น','มาตรา 10 การขัดขวางการทำงานของระบบคอมพิวเตอร์','มาตรา 6 การเปิดเผยมาตรการป้องกันการเข้าถึง','มาตรา 26 การเก็บข้อมูลจราจรทางคอมพิวเตอร์']],
['ผู้ให้บริการต้องเก็บข้อมูลจราจรทางคอมพิวเตอร์ไว้นานเท่าใด เป็นอย่างน้อย',['90 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','30 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','60 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','180 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','365 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ']],
['การดักรับข้อมูลคอมพิวเตอร์ของผู้อื่นที่อยู่ระหว่างส่ง (มาตรา 8) เปรียบได้กับข้อใด',['การเปิดดูเว็บไซต์ข่าวที่เปิดให้ทุกคนอ่านได้ทั่วไป','การสำรองข้อมูลของตนเองไว้ในฮาร์ดดิสก์ภายนอก','การส่งอีเมลถึงเพื่อนร่วมงานในองค์กรเดียวกัน','การติดตั้งโปรแกรมป้องกันไวรัสบนเครื่องของตนเอง','การแอบเปิดอ่านจดหมายของผู้อื่นระหว่างทางถึงปลายทาง']],
['การส่งข้อมูลจำนวนมากให้ระบบของผู้อื่นล่มหรือใช้งานไม่ได้ เป็นความผิดฐานใด',['ดักรับข้อมูลคอมพิวเตอร์ระหว่างการส่งถึงกัน','เปิดเผยรหัสผ่านของผู้อื่นโดยไม่ได้รับอนุญาต','ขัดขวางหรือรบกวนการทำงานของระบบคอมพิวเตอร์','ตัดต่อภาพของผู้อื่นจนทำให้เกิดความเสียหาย','เก็บข้อมูลจราจรไม่ครบตามระยะเวลาที่กำหนด']],
['ความผิดตามมาตรา 14 (นำเข้าข้อมูลคอมพิวเตอร์อันเป็นเท็จ) มีอัตราโทษสูงสุดตามข้อใด',['จำคุกไม่เกิน 6 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับ','จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ','จำคุกไม่เกิน 1 ปี หรือปรับไม่เกิน 20,000 บาท หรือทั้งจำทั้งปรับ','ปรับไม่เกิน 5,000 บาท โดยไม่มีโทษจำคุกแต่อย่างใดทั้งสิ้น','จำคุกไม่เกิน 10 ปี หรือปรับไม่เกิน 1,000,000 บาท หรือทั้งจำทั้งปรับ']],
['การสร้างเว็บไซต์ปลอมเลียนแบบธนาคารเพื่อหลอกให้กรอกข้อมูล (Phishing) มีสถานะอย่างไร',['เป็นเพียงมารยาทที่ไม่เหมาะสมทางสังคมเท่านั้น','ผิดเฉพาะเมื่อผู้ถูกหลอกเป็นข้าราชการเท่านั้น','ไม่ผิดถ้ายังไม่มีผู้ใดสูญเสียเงินจริงๆ เลย','ผิดเฉพาะเมื่อเว็บไซต์ตั้งอยู่นอกประเทศไทยเท่านั้น','ผิดฐานนำเข้าข้อมูลปลอมที่น่าจะเกิดความเสียหายต่อผู้อื่น']],
['การตัดต่อภาพผู้อื่นแล้วโพสต์จนทำให้เสื่อมเสียชื่อเสียง (มาตรา 16) ข้อใดถูกต้อง',['ผิด หากทำให้ผู้ถูกตัดต่อเสียชื่อเสียง ถูกดูหมิ่น เกลียดชัง หรืออับอาย','ไม่ผิดถ้าผู้โพสต์ระบุไว้ว่าเป็นเพียงเรื่องล้อเล่นสนุกๆ','ไม่ผิดถ้าภาพต้นฉบับหาได้ทั่วไปจากอินเทอร์เน็ตอยู่แล้ว','ไม่ผิดถ้าลบภาพออกภายในหนึ่งสัปดาห์หลังจากเผยแพร่','ไม่ผิดถ้าผู้ถูกตัดต่อเป็นบุคคลที่ผู้โพสต์ไม่รู้จักกันมาก่อน']],
['ข้อมูลจราจรทางคอมพิวเตอร์หมายถึงข้อใด',['เนื้อหาในอีเมลที่ผู้ใช้เขียนส่งถึงกันและกัน','รหัสผ่านที่ผู้ใช้ตั้งไว้สำหรับเข้าสู่ระบบ','ไฟล์งานที่ผู้ใช้บันทึกไว้ในเครื่องของตนเอง','ข้อมูลการติดต่อสื่อสาร เช่น ต้นทาง ปลายทาง และเวลา','ภาพถ่ายที่ผู้ใช้อัปโหลดขึ้นสื่อสังคมออนไลน์']],
['การส่งอีเมลโฆษณาจำนวนมากโดยปกปิดแหล่งที่มา จนผู้รับปฏิเสธไม่ได้ จัดเป็นความผิดตามข้อใด',['ตัดต่อภาพของผู้อื่นให้เสื่อมเสียชื่อเสียง','ดักรับข้อมูลของผู้อื่นที่อยู่ระหว่างการส่ง','ส่งข้อมูลรบกวนโดยปกปิดหรือปลอมแหล่งที่มา','เข้าถึงข้อมูลที่มีมาตรการป้องกันโดยมิชอบ','เปิดเผยรหัสผ่านของผู้อื่นโดยไม่ได้รับอนุญาต']],
['พนักงานไอทีใช้รหัสผ่านของหัวหน้าที่จำได้ เข้าระบบเงินเดือนดูข้อมูลเพื่อนร่วมงานโดยไม่ได้รับอนุญาต แม้ไม่ได้แก้ไขข้อมูลใดๆ ผลเป็นอย่างไร',['ไม่ผิดเพราะไม่ได้ทำให้ข้อมูลเสียหายหรือเปลี่ยนแปลง','ไม่ผิดเพราะรหัสผ่านเป็นของบุคคลในองค์กรเดียวกัน','อาจผิดฐานเข้าถึงระบบหรือข้อมูลที่มีมาตรการป้องกันโดยมิชอบ','ผิดเฉพาะเมื่อนำข้อมูลที่ดูไปเผยแพร่ต่อสาธารณะเท่านั้น','ผิดเฉพาะเมื่อมีผู้เสียหายแจ้งความภายในสามวันเท่านั้น']],
['ผู้ให้บริการเว็บบอร์ดทราบว่ามีผู้โพสต์เนื้อหาผิดกฎหมาย แต่จงใจยินยอมไม่ลบออก ผลเป็นอย่างไร',['อาจต้องรับโทษเช่นเดียวกับผู้กระทำความผิดนั้น','ไม่ต้องรับผิดเพราะเป็นเพียงผู้ให้พื้นที่โพสต์เท่านั้น','รับผิดเฉพาะค่าธรรมเนียมทางปกครองเล็กน้อยเท่านั้น','รับผิดเฉพาะเมื่อตนเองเป็นผู้พิมพ์ข้อความนั้นเอง','รับผิดเฉพาะเมื่อมีผู้โพสต์เกินหนึ่งร้อยคนขึ้นไป']],
['ข้อใดทำให้การทดสอบเจาะระบบ (Penetration Test) ไม่เป็นความผิด',['ได้รับอนุญาตด้วยวาจาจากพนักงานบางคนในองค์กร','ทดสอบในช่วงกลางคืนที่ไม่มีผู้ใช้งานระบบอยู่เลย','ไม่ทำลายหรือแก้ไขข้อมูลใดๆ ในระบบที่ทดสอบ','มีเจตนาดีที่จะแจ้งช่องโหว่ให้เจ้าของระบบภายหลัง','ได้รับมอบอำนาจเป็นลายลักษณ์อักษรจากเจ้าของระบบก่อน']],
['ผู้ให้บริการอินเทอร์เน็ตเก็บบันทึกการใช้งานของผู้ใช้เพียง 30 วันแล้วลบทิ้ง ข้อใดถูกต้อง',['ถูกต้อง เพราะ 30 วันเพียงพอตามที่กฎหมายกำหนดแล้ว','อาจฝ่าฝืนหน้าที่เก็บข้อมูลจราจรไม่น้อยกว่า 90 วัน','ถูกต้อง เพราะการเก็บข้อมูลจราจรเป็นไปตามความสมัครใจ','ถูกต้อง เพราะผู้ใช้ร้องขอให้ลบข้อมูลทุกเดือนอยู่แล้ว','ไม่เกี่ยวข้อง เพราะกฎหมายนี้ใช้กับธนาคารเท่านั้น']],
['ข้อใดเข้าข่ายการทำให้ข้อมูลของผู้อื่นเสียหายตามมาตรา 9',['ลบไฟล์ของตนเองที่ไม่ต้องการแล้วออกจากเครื่อง','สำรองข้อมูลโครงการของลูกค้าตามที่ได้รับมอบหมาย','อัปเดตซอฟต์แวร์ของเครื่องตนเองตามที่ผู้ผลิตแนะนำ','ลบฐานข้อมูลลูกค้าของคู่แข่งหลังแอบเข้าระบบด้วยรหัสที่ขโมยมา','ติดตั้งแอนตี้ไวรัสในเครื่องของโรงเรียนตามคำสั่งครู']],
['ข้อใดอธิบายความสัมพันธ์ระหว่างฉบับ พ.ศ. 2550 กับฉบับที่ 2 พ.ศ. 2560 ได้ถูกต้อง',['ฉบับ 2560 ยกเลิกฉบับ 2550 แล้วใช้ชื่อใหม่ทั้งฉบับ','ฉบับ 2560 ใช้เฉพาะกับหน่วยงานของรัฐเท่านั้น','ฉบับ 2560 ใช้เฉพาะกับผู้ให้บริการอินเทอร์เน็ตเท่านั้น','ฉบับ 2560 ถูกยกเลิกแล้วให้กลับไปใช้ฉบับ 2550','ฉบับ 2560 แก้ไขเพิ่มเติมฉบับ 2550 และใช้ควบคู่กัน']],
['ฟรีแลนซ์เขียนสคริปต์ขโมยรหัสผ่านแล้วขายให้ผู้อื่นนำไปเจาะบัญชี ข้อใดถูกต้อง',['อาจผิดฐานจำหน่ายหรือเผยแพร่ชุดคำสั่งที่ใช้กระทำความผิด','ไม่ผิดเพราะเป็นเพียงผู้เขียนโปรแกรมไม่ได้เจาะเอง','ไม่ผิดเพราะโปรแกรมไม่ได้ติดตั้งในเครื่องของผู้ขาย','ไม่ผิดเพราะผู้ซื้อตกลงรับผิดชอบการใช้งานเองทั้งหมด','ไม่ผิดเพราะขายผ่านช่องทางส่วนตัวที่ไม่เปิดเผยทั่วไป']],
['ข้อใดเป็นแนวปฏิบัติที่ดีที่สุดเพื่อป้องกันความผิดตามกฎหมายนี้ในงานดูแลระบบ',['ใช้บัญชีผู้ดูแลระบบร่วมกันทุกคนเพื่อความสะดวก','จดรหัสผ่านติดไว้ที่หน้าจอเพื่อให้ทีมเข้าถึงได้เร็ว','กำหนดสิทธิ์ตามหน้าที่และเก็บบันทึกการเข้าใช้งานไว้ตรวจสอบ','ให้พนักงานใหม่ใช้รหัสของรุ่นพี่ไปก่อนช่วงทดลองงาน','ปิดการบันทึกล็อกเพื่อลดภาระพื้นที่จัดเก็บข้อมูลของระบบ']],
['ผู้ใช้โพสต์ข่าวปลอมว่าธนาคารจะล้มภายในวันนี้ จนผู้คนแห่ถอนเงินด้วยความตื่นตระหนก ข้อใดถูกต้อง',['เป็นเพียงการแสดงความเห็นส่วนตัวที่ไม่มีความผิด','อาจผิดฐานนำเข้าข้อมูลเท็จที่น่าจะเกิดความเสียหายแก่ประชาชน','ผิดเฉพาะเมื่อผู้โพสต์เป็นพนักงานของธนาคารนั้นเท่านั้น','ผิดเฉพาะเมื่อผู้ถอนเงินรวมกันเกินหนึ่งล้านบาทเท่านั้น','ไม่ผิดเพราะผู้โพสต์ไม่ได้รับประโยชน์ตอบแทนโดยตรง']],
['เหตุผลหลักที่กฎหมายกำหนดให้ผู้ให้บริการเก็บข้อมูลจราจรทางคอมพิวเตอร์คือข้อใด',['เพื่อให้ผู้ให้บริการนำไปขายต่อเป็นรายได้เสริม','เพื่อใช้ตรวจเนื้อหาส่วนตัวของผู้ใช้ทุกคนทุกวัน','เพื่อลดภาระของอินเทอร์เน็ตความเร็วสูงในประเทศ','เพื่อเป็นหลักฐานสืบหาตัวผู้กระทำความผิดเมื่อเกิดเหตุ','เพื่อใช้แทนการลงทะเบียนผู้ใช้ด้วยบัตรประชาชน']]
]};
C[3]={
art:['พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) เป็นกฎหมายที่คุ้มครองสิทธิในข้อมูลส่วนบุคคลของบุคคลธรรมดา ข้อมูลส่วนบุคคลคือข้อมูลเกี่ยวกับบุคคลที่ทำให้สามารถระบุตัวบุคคลนั้นได้ ไม่ว่าทางตรงหรือทางอ้อม เช่น ชื่อ เลขบัตรประชาชน เบอร์โทรศัพท์ อีเมล ทั้งนี้ ข้อมูลของนิติบุคคลและข้อมูลของผู้ถึงแก่กรรมไม่ถือเป็นข้อมูลส่วนบุคคลตามกฎหมายนี้','กฎหมายนี้กำหนดบทบาทสำคัญ 3 ฝ่าย คือ เจ้าของข้อมูล (Data Subject) คือบุคคลที่ข้อมูลระบุถึง ผู้ควบคุมข้อมูล (Data Controller) คือผู้มีอำนาจตัดสินใจเกี่ยวกับการเก็บ ใช้ หรือเปิดเผยข้อมูล และผู้ประมวลผลข้อมูล (Data Processor) คือผู้ดำเนินการตามคำสั่งหรือในนามของผู้ควบคุม หากผู้ประมวลผลทำนอกเหนือคำสั่ง อาจต้องรับผิดในฐานะผู้ควบคุมสำหรับการกระทำนั้น','ข้อมูลอ่อนไหว (Sensitive Data) เช่น เชื้อชาติ ศาสนา ความคิดเห็นทางการเมือง ข้อมูลสุขภาพ ประวัติอาชญากรรม ข้อมูลพันธุกรรม และข้อมูลชีวภาพ ต้องได้รับการคุ้มครองเข้มงวดกว่าปกติ โดยทั่วไปต้องได้รับความยินยอมโดยชัดแจ้งก่อนเก็บ ใช้ หรือเปิดเผย ผู้ประกอบวิชาชีพไอทีจึงต้องเก็บข้อมูลเท่าที่จำเป็น และไม่เก็บข้อมูลอ่อนไหวหากไม่มีเหตุจำเป็น','การเก็บ ใช้ หรือเปิดเผยข้อมูลต้องมีฐานทางกฎหมายรองรับ เช่น ความยินยอมของเจ้าของข้อมูล การปฏิบัติตามสัญญา การปฏิบัติตามกฎหมาย หรือประโยชน์โดยชอบด้วยกฎหมาย ความยินยอมต้องขอแยกชัดเจน ระบุวัตถุประสงค์ และเจ้าของข้อมูลต้องมีทางเลือกที่จะไม่ให้ได้ รวมทั้งถอนความยินยอมได้ภายหลัง เจ้าของข้อมูลมีสิทธิ เช่น เข้าถึงและขอรับสำเนา แก้ไข ลบหรือทำลาย คัดค้าน ระงับการใช้ และขอโอนย้ายข้อมูล','ผู้ควบคุมข้อมูลต้องจัดให้มีมาตรการรักษาความมั่นคงปลอดภัยที่เหมาะสม เมื่อเกิดเหตุละเมิดข้อมูลที่มีความเสี่ยงต่อสิทธิของบุคคล ต้องแจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลภายใน 72 ชั่วโมงนับแต่ทราบเหตุ การฝ่าฝืนอาจมีทั้งความรับผิดทางแพ่ง โทษอาญา และโทษปรับทางปกครอง ส่วนการเก็บข้อมูลเพื่อประโยชน์ส่วนตนหรือในครอบครัวได้รับการยกเว้นไม่อยู่ภายใต้กฎหมายนี้'],
ws:['อธิบายความหมายของข้อมูลส่วนบุคคลและข้อมูลอ่อนไหว พร้อมยกตัวอย่างอย่างละ 3 ตัวอย่าง','เปรียบเทียบเจ้าของข้อมูล ผู้ควบคุมข้อมูล และผู้ประมวลผลข้อมูล โดยยกตัวอย่างจากระบบเว็บไซต์ของวิทยาลัยหรือร้านค้าออนไลน์','อธิบายสิทธิของเจ้าของข้อมูลอย่างน้อย 4 สิทธิ พร้อมยกตัวอย่างสถานการณ์ที่ใช้สิทธินั้น','ร่างข้อความขอความยินยอมสำหรับแบบฟอร์มสมัครสมาชิกเว็บไซต์ โดยระบุข้อมูลที่เก็บ วัตถุประสงค์ ระยะเวลาเก็บ และสิทธิในการถอนความยินยอม','ระบบของบริษัทถูกแฮกและข้อมูลลูกค้ารั่วไหล อธิบายขั้นตอนที่ผู้ควบคุมข้อมูลควรปฏิบัติตามลำดับ พร้อมเหตุผล'],
ex:[
['ข้อใดคือความหมายของข้อมูลส่วนบุคคลตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล',['ข้อมูลของบริษัทที่จดทะเบียนเป็นนิติบุคคลทุกแห่ง','ข้อมูลของผู้ที่เสียชีวิตไปแล้วซึ่งไม่มีทายาทดูแล','ข้อมูลเกี่ยวกับบุคคลที่ทำให้ระบุตัวบุคคลนั้นได้','ข้อมูลสถิติรวมที่ไม่อาจระบุถึงตัวบุคคลใดได้เลย','ข้อมูลทั่วไปที่ลงไว้ในหนังสือพิมพ์รายวันทั่วไป']],
['เจ้าของข้อมูลส่วนบุคคล (Data Subject) คือผู้ใด',['บุคคลธรรมดาซึ่งข้อมูลนั้นระบุถึงตัวบุคคลนั้น','บริษัทที่เก็บรวบรวมข้อมูลของลูกค้าไว้ในระบบ','ผู้พัฒนาระบบฐานข้อมูลที่ใช้จัดเก็บข้อมูลดังกล่าว','เจ้าหน้าที่ที่มีหน้าที่ตรวจสอบการปฏิบัติตามกฎหมาย','ผู้ให้บริการคลาวด์ที่เก็บข้อมูลไว้บนเซิร์ฟเวอร์']],
['ข้อใดเป็นข้อมูลอ่อนไหว (Sensitive Data)',['ชื่อและนามสกุลของนักศึกษาในระบบทะเบียน','หมายเลขโทรศัพท์ที่ใช้ติดต่อกับลูกค้าทั่วไป','ที่อยู่อีเมลของผู้สมัครงานตำแหน่งต่างๆ','ชื่อสถานศึกษาที่ผู้สมัครกำลังเรียนอยู่ขณะนี้','ข้อมูลสุขภาพและศาสนาของบุคคลหนึ่งๆ']],
['ผู้ควบคุมข้อมูลส่วนบุคคล (Data Controller) คือผู้ใด',['ผู้ที่ประมวลผลตามคำสั่งโดยไม่มีอำนาจตัดสินใจเอง','ผู้มีอำนาจตัดสินใจเกี่ยวกับการเก็บ ใช้ หรือเปิดเผยข้อมูล','ผู้ที่เป็นเจ้าของข้อมูลซึ่งข้อมูลนั้นระบุถึงตัวบุคคล','ผู้ที่เขียนโปรแกรมเว็บไซต์ให้กับหน่วยงานทั่วไปได้','ผู้ที่เข้าชมเว็บไซต์ของหน่วยงานผ่านอินเทอร์เน็ต']],
['พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคลฉบับนี้ ตราขึ้นในปี พ.ศ. ใด',['พ.ศ. 2540','พ.ศ. 2545','พ.ศ. 2550','พ.ศ. 2562','พ.ศ. 2566']],
['ข้อใดเป็นสิทธิของเจ้าของข้อมูลส่วนบุคคลตามกฎหมายนี้',['ขอเข้าถึงและขอรับสำเนาข้อมูลของตนที่ผู้ควบคุมเก็บไว้','กำหนดโทษทางอาญาแก่ผู้ควบคุมข้อมูลได้ด้วยตนเอง','เรียกดูข้อมูลส่วนบุคคลของบุคคลอื่นในระบบเดียวกัน','ห้ามผู้ควบคุมเก็บข้อมูลใดๆ ทุกกรณีโดยไม่มีข้อยกเว้น','กำหนดนโยบายความมั่นคงปลอดภัยของระบบแทนผู้ควบคุม']],
['โดยทั่วไป การเก็บข้อมูลส่วนบุคคลต้องมีฐานรองรับตามข้อใด',['ผู้เก็บต้องการข้อมูลไว้ใช้ภายหลังโดยยังไม่ทราบวัตถุประสงค์','เพื่อนของผู้เก็บแนะนำว่าข้อมูลนั้นอาจมีประโยชน์ต่อธุรกิจ','เจ้าของข้อมูลให้ความยินยอมหรือมีฐานตามกฎหมายอื่นรองรับ','ข้อมูลนั้นหาได้ง่ายบนอินเทอร์เน็ตจึงเก็บได้ทันทีโดยอิสระ','ผู้เก็บเป็นบริษัทขนาดใหญ่จึงได้รับการยกเว้นโดยอัตโนมัติ']],
['เมื่อเกิดเหตุละเมิดข้อมูลที่มีความเสี่ยงต่อสิทธิของบุคคล ต้องแจ้งสำนักงานคุ้มครองข้อมูลส่วนบุคคลภายในเวลาใด',['24 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','48 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','96 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','7 วัน นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้นเป็นต้นไป','72 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น']],
['ผู้ประมวลผลข้อมูลส่วนบุคคล (Data Processor) คือผู้ใด',['ผู้ตัดสินใจวัตถุประสงค์ของการใช้ข้อมูลด้วยตนเอง','ผู้ดำเนินการเกี่ยวกับข้อมูลตามคำสั่งหรือในนามของผู้ควบคุม','ผู้ที่ได้รับสิทธิ์ขายข้อมูลให้บุคคลภายนอกโดยอิสระ','ผู้ที่เป็นเจ้าของข้อมูลและเป็นผู้ให้ความยินยอมนั้น','ผู้ตรวจสอบของรัฐที่ลงพื้นที่ตรวจเยี่ยมสถานประกอบการ']],
['ชื่อและที่ตั้งของบริษัท (นิติบุคคล) มีสถานะตามกฎหมายนี้อย่างไร',['เป็นข้อมูลอ่อนไหวที่ต้องขอความยินยอมทุกครั้งเสมอ','เป็นข้อมูลส่วนบุคคลที่ได้รับการคุ้มครองเต็มรูปแบบ','เป็นข้อมูลที่ห้ามเผยแพร่ในทุกกรณีตามกฎหมายนี้เลย','ไม่ถือเป็นข้อมูลส่วนบุคคลตามกฎหมายนี้โดยตัวมันเอง','เป็นข้อมูลของผู้ตายที่ต้องมีทายาทเป็นผู้ให้ความยินยอม']],
['ร้านซ่อมคอมพิวเตอร์ขอสำเนาบัตรประชาชนลูกค้าทุกคนเก็บไว้ ทั้งที่ไม่จำเป็นต่อการซ่อม ข้อใดถูกต้อง',['ทำได้เพราะเป็นร้านที่ลูกค้าไว้วางใจอยู่แล้ว','ทำได้เพราะลูกค้าไม่ได้คัดค้านระหว่างรับบริการ','ทำได้เพราะข้อมูลบนบัตรเป็นข้อมูลที่เปิดเผยทั่วไป','ทำได้ถ้าเก็บไว้ในลิ้นชักที่ล็อกกุญแจอย่างแน่นหนา','ขัดหลักเก็บเท่าที่จำเป็น เพราะเกินวัตถุประสงค์ของบริการ']],
['ผู้รับจ้างทำเว็บให้โรงเรียนนำข้อมูลนักเรียนไปให้บริษัทโฆษณาเอง โดยโรงเรียนไม่ได้สั่ง ข้อใดถูกต้อง',['ผู้ประมวลผลทำได้เพราะเป็นผู้ดูแลฐานข้อมูลอยู่แล้ว','ทำได้ถ้าเป็นข้อมูลเพียงชื่อกับห้องเรียนเท่านั้น','อาจถือว่าใช้เกินคำสั่ง และต้องรับผิดในฐานะผู้ควบคุมเอง','ทำได้เมื่อบริษัทโฆษณาจ่ายค่าตอบแทนให้โรงเรียนแล้ว','ทำได้เพราะนักเรียนใช้เว็บไซต์ของโรงเรียนอยู่ทุกวัน']],
['ระบบโรงเรียนถูกแฮกและข้อมูลนักเรียนรั่ว โดยมีความเสี่ยงต่อสิทธิของบุคคล ผู้ควบคุมข้อมูลควรทำอย่างไร',['แจ้งสำนักงานภายใน 72 ชั่วโมง และแจ้งเจ้าของข้อมูลหากเสี่ยงสูง','รอดูสถานการณ์หนึ่งเดือนก่อนตัดสินใจว่าจะแจ้งใครหรือไม่','แจ้งเฉพาะผู้บริหารภายในและไม่เปิดเผยแก่ผู้ใดภายนอก','ลบหลักฐานทั้งหมดเพื่อไม่ให้มีผู้ตรวจสอบพบเหตุการณ์','แจ้งเฉพาะนักเรียนที่ผู้ปกครองร้องเรียนมาก่อนแล้วเท่านั้น']],
['การขอความยินยอมในเว็บไซต์แบบใดที่ถูกต้องตามหลักของกฎหมายนี้',['ติ๊กถูกให้ล่วงหน้าไว้ในช่องเพื่อประหยัดเวลาของผู้ใช้','ผูกรวมกับการยอมรับข้อตกลงบริการโดยไม่ให้แยกเลือกได้','เขียนถ้อยคำกว้างๆ ให้ใช้ข้อมูลเพื่อวัตถุประสงค์ใดก็ได้','แยกชัดเจน บอกวัตถุประสงค์ และให้เลือกให้หรือไม่ให้ได้','ถือว่ายินยอมโดยปริยายเมื่อผู้ใช้เพียงเข้าเว็บไซต์ต่อ']],
['ผู้ใช้ขอลบบัญชีและข้อมูลของตน โดยตอนสมัครเคยให้ความยินยอมไว้ ข้อใดถูกต้อง',['ปฏิเสธได้เพราะให้ความยินยอมไปแล้วจึงเปลี่ยนไม่ได้','ผู้ใช้ถอนความยินยอมได้ และต้องลบเมื่อไม่มีฐานอื่นเก็บ','ลบได้เฉพาะเมื่อผู้ใช้จ่ายค่าธรรมเนียมการลบข้อมูลก่อน','ลบได้เฉพาะเมื่อผ่านไปอย่างน้อยห้าปีนับแต่วันที่สมัคร','ปฏิเสธได้เสมอเพราะข้อมูลเป็นทรัพย์สินของผู้ให้บริการ']],
['ข้อใดสอดคล้องกับหลักเก็บข้อมูลเท่าที่จำเป็นในแบบฟอร์มสมัครฝึกงานออนไลน์',['ขอเลขบัตรประชาชนและกรุ๊ปเลือดของผู้สมัครทุกคน','ขอข้อมูลศาสนาและสถานภาพครอบครัวเพื่อประกอบการคัดเลือก','ขอเฉพาะชื่อ อีเมล และสถานศึกษาที่จำเป็นต่อการติดต่อ','ขอสำเนาทะเบียนบ้านไว้ก่อนเผื่อใช้ในอนาคตภายหลัง','ขอรหัสผ่านโซเชียลมีเดียเพื่อตรวจสอบประวัติเพิ่มเติม']],
['การติดตั้งกล้อง CCTV ในสำนักงาน ข้อใดสอดคล้องกับกฎหมายนี้',['ไม่ต้องแจ้งใครเพราะเป็นพื้นที่ของตนเองทั้งหมด','ติดได้ทุกจุดรวมถึงห้องน้ำถ้าเจ้าของอาคารเห็นด้วย','แจ้งเฉพาะเมื่อมีผู้ร้องเรียนการติดตั้งแล้วเท่านั้น','เก็บภาพไว้ตลอดไปเพราะเป็นหลักฐานที่อาจมีประโยชน์','ติดป้ายแจ้งวัตถุประสงค์ กำหนดระยะเวลาเก็บ และจำกัดผู้เข้าถึง']],
['ข้อใดคือการออกแบบระบบให้คุ้มครองข้อมูลตั้งแต่ต้น (Privacy by Design)',['เข้ารหัสข้อมูลสำคัญและจำกัดสิทธิ์เข้าถึงตั้งแต่ขั้นออกแบบ','เพิ่มมาตรการป้องกันหลังจากมีข้อมูลรั่วไหลเกิดขึ้นแล้ว','เก็บข้อมูลทุกช่องไว้ก่อนแล้วค่อยลบเมื่อมีผู้ร้องขอภายหลัง','ให้ทุกคนในทีมเข้าถึงฐานข้อมูลจริงเพื่อความสะดวกทดสอบ','เปิดโครงสร้างฐานข้อมูลบนที่สาธารณะเพื่อความโปร่งใสทั้งหมด']],
['กรณีใดได้รับยกเว้นไม่อยู่ภายใต้กฎหมายคุ้มครองข้อมูลส่วนบุคคล',['เก็บข้อมูลลูกค้าของร้านค้าออนไลน์เพื่อใช้จัดส่งสินค้า','เก็บข้อมูลพนักงานของบริษัทเพื่อใช้จ่ายเงินเดือนประจำเดือน','เก็บข้อมูลผู้ป่วยของคลินิกเพื่อใช้ประกอบการรักษาพยาบาล','จดรายชื่อญาติและเพื่อนไว้ใช้เป็นการส่วนตัวภายในครอบครัว','เก็บข้อมูลผู้สมัครงานของบริษัทเพื่อใช้คัดเลือกเข้าทำงาน']],
['การฝ่าฝืนกฎหมายคุ้มครองข้อมูลส่วนบุคคลมีผลอย่างไร',['มีเฉพาะโทษทางแพ่งเท่านั้นและไม่มีโทษทางอื่นใดอีก','อาจมีทั้งความรับผิดทางแพ่ง โทษอาญา และโทษทางปกครอง','มีเฉพาะโทษทางปกครองเท่านั้นและไม่มีโทษทางอื่นใดอีก','มีเฉพาะการตักเตือนด้วยวาจาและบันทึกประวัติไว้เท่านั้น','ไม่มีโทษใดเลยหากไม่ได้กระทำเพื่อหากำไรจากข้อมูลนั้น']]
]};

/* ===== ระบบ ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,st={ws:[],ex:[]},U=null,tab='a',read={},ex={i:0,a:[]},adm=null,AU=1,AS=null;
async function rpc(fn,a){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});
 if(!r.ok){let m='เกิดข้อผิดพลาด';try{m=(await r.json()).message||m}catch(_){}throw new Error(m)}const t=await r.text();return t?JSON.parse(t):null}
const FS=()=>document.fullscreenElement||document.webkitFullscreenElement,CANFS=document.fullscreenEnabled||document.webkitFullscreenEnabled;
function goFS(){const e=document.documentElement;try{const p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e);p&&p.catch&&p.catch(()=>{})}catch(_){}}
function fsCheck(){$('#fs').style.display=(me&&me.role==='student'&&CANFS&&!FS())?'flex':'none'}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsCheck));
/* กันคัดลอก/วาง */
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('beforeinput',e=>{if(/Paste|Drop/.test(e.inputType))e.preventDefault()},true);
document.addEventListener('selectstart',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&/^[cvxaups]$/i.test(e.key)||e.key==='F12')e.preventDefault()});
document.addEventListener('input',e=>{const t=e.target;if(t.tagName!=='TEXTAREA'&&t.tagName!=='INPUT')return;
 if(t.value.length-(t._p||0)>20&&!e.isComposing)t.value=t._p||'';t._p=t.value.length?t.value:''});
document.addEventListener('input',e=>{if(e.target._p===undefined)e.target._p=''},true);

async function loadSt(){st=await rpc('app_status',{t:me.t,b:me.b})||st}
async function loadAdm(){adm=await rpc('admin_data',{t:me.t,b:me.b})}
async function doLogin(){goFS();const t=$('#t').value.trim(),b=$('#b').value.trim();$('#e').textContent='';
 try{const r=await rpc('app_login',{t,b});if(!r){$('#e').textContent='รหัสไม่ถูกต้อง';return}
  me={t,b,...r};r.role==='admin'?await loadAdm():await loadSt();render()}catch(x){$('#e').textContent=x.message}}
function logout(){me=null;U=null;AS=null;tab='a';read={};if(FS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);render()}
const hasWs=u=>st.ws.some(w=>w.unit==u),hasEx=u=>st.ex.includes(u);
function render(){fsCheck();$('#app').innerHTML=!me?loginV():me.role==='admin'?adminV():U?unitV():homeV();window.scrollTo(0,0)}

function loginV(){return `<div class="card" style="margin-top:12vh"><h1>ใบงานออนไลน์</h1><div class="mu">31900-1001 กฎหมายในงานอาชีพอุตสาหกรรมดิจิทัลและเทคโนโลยีสารสนเทศ</div>
<p><label>รหัสบน (รหัสนักศึกษา)<input id="t" autocomplete="off" autocapitalize="none" inputmode="text"></label>
<label>รหัสล่าง<input id="b" type="password" autocomplete="off"></label></p><div class="err" id="e"></div>
<button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button></div>`}
function homeV(){let done=0;UNITS.forEach((_,i)=>{if(hasWs(i+1)&&hasEx(i+1))done++});
 return `<h1>สวัสดี ${esc(me.name)}</h1><div class="mu">${esc(me.grp||'')} · เสร็จแล้ว ${done}/15 หน่วย</div><div class="bar" style="margin:8px 0"><i style="width:${done/15*100}%"></i></div>
${UNITS.map((n,i)=>{const u=i+1,ok=!!C[u];return `<div class="card" ${ok?`onclick="U=${u};tab='a';render()" style="cursor:pointer"`:'style="opacity:.5"'}><b>หน่วยที่ ${u}</b> ${esc(n)}<div style="margin-top:4px">
${ok?`<span class="chip ${hasWs(u)?'on':''}">ใบงาน${hasWs(u)?' ✓':''}</span><span class="chip ${hasEx(u)?'on':''}">สอบ${hasEx(u)?' ✓':''}</span>`:'<span class="chip">เร็วๆ นี้</span>'}</div></div>`}).join('')}
<button class="btn g" onclick="logout()">ออกจากระบบ</button>`}
function unitV(){const T=(k,l)=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`;
 return `<button class="btn g" style="margin:0 0 8px" onclick="U=null;render()">← กลับ</button><h2>หน่วยที่ ${U} ${esc(UNITS[U-1])}</h2>
<div class="tabs">${T('a','1 บทความ')}${T('w','2 ใบงาน')}${T('x','3 ข้อสอบ')}</div>${tab==='a'?artV():tab==='w'?wsV():exV()}`}
const lock=m=>`<div class="card" style="text-align:center">🔒 ${m}</div>`;
function artV(){return `<div class="card">${C[U].art.map(p=>`<p>${esc(p)}</p>`).join('')}</div><button class="btn" onclick="read[U]=1;tab='w';render()">อ่านจบแล้ว → ไปทำใบงาน</button>`}
function wsV(){if(hasWs(U))return `<div class="card ok">✓ ส่งใบงานแล้ว</div>`+(st.ws.find(w=>w.unit==U).score!=null?`<div class="card">คะแนนใบงาน: <b>${st.ws.find(w=>w.unit==U).score}</b></div>`:'<div class="card mu">รอครูตรวจใบงาน</div>')+`<button class="btn" onclick="tab='x';render()">ไปทำข้อสอบ →</button>`;
 if(!read[U])return lock('กรุณาอ่านบทความให้จบก่อนทำใบงาน')+`<button class="btn" onclick="tab='a';render()">ไปอ่านบทความ</button>`;
 return C[U].ws.map((q,i)=>`<div class="card"><b>ข้อ ${i+1}.</b> ${esc(q)}<textarea id="w${i}" placeholder="พิมพ์คำตอบ (ห้ามวางข้อความ)"></textarea></div>`).join('')+`<div class="err" id="e"></div><button class="btn" onclick="subWs()">ส่งใบงาน</button>`}
async function subWs(){const a=C[U].ws.map((_,i)=>$('#w'+i).value.trim());
 if(a.some(x=>x.length<15)){$('#e').textContent='กรุณาตอบให้ครบทุกข้อ (อย่างน้อย 15 ตัวอักษร)';return}
 if(!confirm('ยืนยันส่งใบงาน? ส่งแล้วแก้ไขไม่ได้'))return;
 try{await rpc('submit_ws',{t:me.t,b:me.b,u:U,a});await loadSt();render()}catch(x){$('#e').textContent=x.message}}
function exV(){if(!hasWs(U))return lock('ต้องส่งใบงานก่อน จึงจะสอบได้');
 if(hasEx(U))return `<div class="card ok">✓ ส่งใบงานและสอบสำเร็จ</div><button class="btn g" onclick="U=null;render()">กลับหน้าหลัก</button>`;
 if(!ex.on)return `<div class="card"><b>ข้อสอบหน่วยที่ ${U}</b><p>20 ข้อ 5 ตัวเลือก ทำได้ครั้งเดียว ไม่สามารถกลับมาแก้ไขหลังส่ง ควรอยู่ในโหมดเต็มจอตลอดการสอบ</p></div><button class="btn" onclick="ex={on:1,i:0,a:Array(20).fill(null)};render()">เริ่มสอบ</button>`;
 const Q=C[U].ex,q=Q[ex.i],n=ex.a.filter(x=>x!==null).length;
 return `<div class="mu">ข้อ ${ex.i+1}/20 · ตอบแล้ว ${n}</div><div class="bar"><i style="width:${(ex.i+1)/20*100}%"></i></div>
<div class="card"><b>${ex.i+1}. ${esc(q[0])}</b>${q[1].map((o,k)=>`<button class="opt ${ex.a[ex.i]===k?'sel':''}" onclick="ex.a[ex.i]=${k};render()">${L[k]}. ${esc(o)}</button>`).join('')}</div>
<div class="row"><button class="btn g" ${ex.i?'':'disabled'} onclick="ex.i--;render()">← ก่อนหน้า</button>
${ex.i<19?`<button class="btn" onclick="ex.i++;render()">ถัดไป →</button>`:`<button class="btn" ${n<20?'disabled':''} onclick="subEx()">ส่งข้อสอบ</button>`}</div>
<div class="row" style="margin-top:10px;flex-wrap:wrap">${Q.map((_,i)=>`<button class="chip ${ex.a[i]!==null?'on':''}" style="flex:0 0 12%;margin:2px;padding:6px 0;background:none" onclick="ex.i=${i};render()">${i+1}</button>`).join('')}</div>`}
async function subEx(){if(!confirm('ยืนยันส่งข้อสอบ?'))return;
 try{await rpc('submit_exam',{t:me.t,b:me.b,u:U,a:ex.a.map(x=>x+1)});ex={};await loadSt();render()}catch(x){alert(x.message)}}

/* ===== ผู้ตรวจ ===== */
function adminV(){const ws=u=>adm.ws.find(w=>w.student==u.id&&w.unit==AU),xs=u=>adm.ex.find(w=>w.student==u.id&&w.unit==AU);
 let h=`<h1>ผู้ตรวจงาน</h1><select id="au" onchange="AU=+this.value;AS=null;render()" style="width:100%;padding:10px;border-radius:10px;background:#0b1220;color:var(--tx);border:1px solid var(--line);font:1rem Sarabun">${UNITS.map((n,i)=>`<option value="${i+1}" ${AU==i+1?'selected':''}>หน่วยที่ ${i+1} ${esc(n)}</option>`).join('')}</select>`;
 if(AS){const s=adm.students.find(x=>x.id==AS),w=adm.ws.find(x=>x.student==AS&&x.unit==AU),q=C[AU]?C[AU].ws:[];
  h+=`<div class="card"><b>${esc(s.name)}</b> <span class="mu">${s.id}</span>${w?w.answers.map((a,i)=>`<p><b>ข้อ ${i+1}.</b> <span class="mu">${esc(q[i]||'')}</span><br>${esc(a)}</p>`).join('')+`<label>คะแนนใบงาน<input id="sc" type="number" value="${w.score??''}"></label><button class="btn" onclick="saveSc()">บันทึกคะแนน</button>`:'<p class="mu">ยังไม่ส่งใบงาน</p>'}</div><button class="btn g" onclick="AS=null;render()">← กลับรายชื่อ</button>`}
 else h+=`<div class="card" style="overflow:auto"><table><tr><th>รหัส/ชื่อ</th><th>ใบงาน</th><th>คะแนน</th><th>สอบ</th></tr>${adm.students.map(s=>{const w=ws(s),x=xs(s);return `<tr class="c" onclick="AS='${s.id}';render()"><td>${s.id}<br><span class="mu">${esc(s.name)} (${esc(s.grp)})</span></td><td>${w?'✓':'–'}</td><td>${w&&w.score!=null?w.score:'–'}</td><td>${x?x.score+'/20':'–'}</td></tr>`}).join('')}</table></div>
<button class="btn g" onclick="loadAdm().then(render)">รีเฟรช</button>`;
 return h+`<button class="btn g" onclick="logout()">ออกจากระบบ</button>`}
async function saveSc(){const v=parseInt($('#sc').value);if(isNaN(v))return;try{await rpc('admin_score',{t:me.t,b:me.b,s:AS,u:AU,sc:v});await loadAdm();AS=null;render()}catch(x){alert(x.message)}}
render();
</script></body></html>
