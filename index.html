['โดยทั่วไป กฎหมายมีผลบังคับใช้เมื่อใด',['เมื่อร่างกฎหมายผ่านการพิจารณาในชั้นกรรมาธิการ เป็นหลัก','เมื่อนายกรัฐมนตรีแถลงข่าวต่อสื่อมวลชนทุกช่องทาง เป็นหลัก','เมื่อมีการโพสต์ข้อความในสื่อสังคมออนไลน์ของรัฐ','เมื่อประชาชนส่วนใหญ่ทราบเนื้อหาของร่างกฎหมายนั้น เป็นหลัก','เมื่อประกาศในราชกิจจานุเบกษาและถึงวันที่กำหนดใช้']],
['ฟรีแลนซ์ส่งมอบเว็บไซต์ครบแล้ว แต่ลูกค้าไม่จ่ายเงินตามสัญญา กรณีนี้เป็นอะไรในเบื้องต้น',['ความผิดอาญาแผ่นดินที่ตำรวจต้องดำเนินคดีทันที เป็นหลัก','ข้อพิพาททางแพ่งเรื่องผิดสัญญาที่เรียกให้ชำระได้','เรื่องจริยธรรมล้วนที่กฎหมายไม่เข้าไปเกี่ยวข้อง เป็นหลัก','ความผิดทางปกครองที่ต้องร้องเรียนต่อหน่วยงานรัฐ เป็นหลัก','เรื่องส่วนตัวที่ศาลไม่รับฟ้องไม่ว่ากรณีใดก็ตาม']],
['ระเบียบบริษัทให้ทำงานล่วงเวลาโดยไม่จ่ายค่าตอบแทน ซึ่งขัดกับกฎหมายคุ้มครองแรงงาน ผลเป็นอย่างไร',['บังคับใช้ได้เพราะพนักงานเซ็นรับทราบระเบียบแล้ว ในเบื้องต้น','บังคับใช้ได้เพราะระเบียบบริษัทเป็นกฎหมายเฉพาะกิจการ','บังคับใช้ได้เมื่อผู้บริหารส่วนใหญ่ของบริษัทเห็นชอบ เป็นหลัก','บังคับใช้ไม่ได้ในส่วนที่ขัดกับกฎหมายที่ศักดิ์สูงกว่า','บังคับใช้ได้ตราบใดที่ยังไม่มีพนักงานคนใดร้องเรียน']],
['ข้อใดเรียงลำดับศักดิ์ของกฎหมายจากสูงไปต่ำได้ถูกต้อง',['รัฐธรรมนูญ → พ.ร.บ. → พระราชกฤษฎีกา → กฎกระทรวง → ข้อบัญญัติท้องถิ่น','พ.ร.บ. → รัฐธรรมนูญ → กฎกระทรวง → พระราชกฤษฎีกา → ข้อบัญญัติท้องถิ่น','รัฐธรรมนูญ → กฎกระทรวง → พ.ร.บ. → ข้อบัญญัติท้องถิ่น → พระราชกฤษฎีกา','รัฐธรรมนูญ → พ.ร.บ. → กฎกระทรวง → พระราชกฤษฎีกา → ข้อบัญญัติท้องถิ่น','ข้อบัญญัติท้องถิ่น → กฎกระทรวง → พระราชกฤษฎีกา → พ.ร.บ. → รัฐธรรมนูญ']],
['มีการออกกฎหมายห้ามพฤติกรรมหนึ่งในปีนี้ แต่มีผู้ทำพฤติกรรมนั้นเมื่อปีก่อน ศาลจะลงโทษได้หรือไม่',['ลงโทษได้เพราะพฤติกรรมนั้นไม่เหมาะสมต่อสังคม เป็นหลัก','ลงโทษได้เพราะผู้กระทำควรคาดได้ว่าจะมีกฎหมาย ในเบื้องต้น','ลงโทษได้หากความเสียหายที่เกิดขึ้นมีมูลค่าสูงมาก เป็นหลัก','ลงโทษได้ถ้าประชาชนส่วนใหญ่เรียกร้องให้ลงโทษ ในเบื้องต้น','ลงโทษไม่ได้ เพราะกฎหมายอาญาไม่มีผลย้อนหลังเป็นโทษ']],
['ข้อใดแสดงความแตกต่างระหว่างกฎหมายกับจริยธรรมได้ชัดเจนที่สุด',['ทั้งสองอย่างมีโทษจำคุกที่ศาลเป็นผู้กำหนดเหมือนกัน','จริยธรรมมีศักดิ์สูงกว่ารัฐธรรมนูญจึงบังคับใช้ได้เสมอ','กฎหมายมีรัฐบังคับพร้อมบทลงโทษ จริยธรรมเป็นมาตรฐานสังคม','กฎหมายเป็นเรื่องของรัฐ ส่วนจริยธรรมเป็นเรื่องของศาสนาเท่านั้น','จริยธรรมใช้กับนักศึกษา ส่วนกฎหมายใช้กับครูอาจารย์เท่านั้น']],
['นักศึกษาฝึกงานถ่ายภาพหน้าจอระบบภายในของลูกค้าไปโพสต์ ทั้งที่มีสัญญารักษาความลับ ผลเป็นอย่างไร',['อาจต้องรับผิดตามสัญญาและกฎหมายอื่นที่เกี่ยวข้อง','ไม่ผิดเพราะเป็นเพียงนักศึกษาที่ยังไม่มีรายได้ประจำ','ไม่ผิดเพราะโพสต์ในบัญชีส่วนตัวไม่ใช่บัญชีบริษัท','ไม่ผิดเพราะไม่ได้นำภาพไปขายหรือหากำไรโดยตรง','ผิดเฉพาะเมื่อมีผู้กดไลก์โพสต์เกินหนึ่งพันคนขึ้นไป']],
['ลูกค้าสั่งให้ติดตั้งโปรแกรมละเมิดลิขสิทธิ์ทั้งออฟฟิศ ผู้ประกอบวิชาชีพไอทีควรทำอย่างไร',['ติดตั้งให้ตามคำสั่งเพราะลูกค้าเป็นผู้จ่ายเงินจ้าง','ติดตั้งให้แต่เก็บหลักฐานไว้ว่าลูกค้าเป็นผู้สั่งการ','ติดตั้งให้เฉพาะเครื่องที่ใช้งานจริงเพื่อลดความเสียหาย','เงียบไว้และปล่อยให้ลูกค้าตัดสินใจเองทุกขั้นตอน','ปฏิเสธพร้อมอธิบายความเสี่ยงและเสนอทางเลือกถูกกฎหมาย']],
['หลัก "ไม่มีความผิด ไม่มีโทษ โดยไม่มีกฎหมาย" หมายความว่าอย่างไร',['ศาลลงโทษได้ทุกการกระทำที่สังคมเห็นว่าไม่เหมาะสม เป็นหลัก','ศาลลงโทษได้เฉพาะการกระทำที่กฎหมายบัญญัติเป็นความผิดไว้ก่อน','ศาลลงโทษได้เมื่อผู้เสียหายร้องขอแม้ไม่มีกฎหมายกำหนด เป็นหลัก','ศาลลงโทษได้ตามความเห็นส่วนตัวของผู้พิพากษาแต่ละท่าน ในเบื้องต้น','ศาลลงโทษได้เมื่อพฤติกรรมนั้นเคยเกิดขึ้นในต่างประเทศ เป็นหลัก']],
['ข้อบัญญัติของ อบต. ขัดกับ พ.ร.บ. ที่ออกโดยรัฐสภา ผลเป็นอย่างไร',['ใช้ข้อบัญญัติเพราะใกล้ชิดกับประชาชนในพื้นที่มากกว่า โดยทั่วไป','ใช้ทั้งสองฉบับพร้อมกันโดยเลือกตามความสะดวกของผู้ใช้ ในเบื้องต้น','ใช้ฉบับที่ประกาศทีหลังโดยไม่ต้องคำนึงถึงศักดิ์ของกฎหมาย ตามความเหมาะสม','ใช้ พ.ร.บ. เพราะศักดิ์สูงกว่า ส่วนที่ขัดของข้อบัญญัติใช้ไม่ได้','ยกเลิกทั้งสองฉบับแล้วรอให้มีกฎหมายใหม่ออกมาใช้แทนกัน ตามความเหมาะสม']],
['เหตุผลสำคัญที่สุดที่ผู้ประกอบวิชาชีพไอทีต้องรู้กฎหมายในงานของตนคือข้อใด',['เพื่อใช้เป็นช่องทางหาประโยชน์จากลูกค้าที่ไม่รู้กฎหมาย','เพื่อหลีกเลี่ยงการทำงานร่วมกับหน่วยงานของรัฐทั้งหมด','เพื่อป้องกันความเสี่ยงทางกฎหมายของตน ลูกค้า และองค์กร','เพื่อให้สามารถตัดสินคดีแทนศาลได้เมื่อเกิดข้อพิพาท','เพื่อใช้อ้างว่าไม่ต้องรับผิดชอบทุกครั้งที่งานเกิดปัญหา']]
]}};

C[2]={
art:['พระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ พ.ศ. 2550 เป็นกฎหมายหลักที่กำหนดความผิดและโทษเกี่ยวกับการใช้ระบบคอมพิวเตอร์ ต่อมามีการแก้ไขโดยฉบับที่ 2 พ.ศ. 2560 ซึ่งมีผลใช้บังคับตั้งแต่วันที่ 24 พฤษภาคม 2560 โดยทั้งสองฉบับใช้บังคับควบคู่กัน ผู้ประกอบวิชาชีพไอทีควรตรวจสอบฉบับล่าสุดจากราชกิจจานุเบกษาเสมอ','ความผิดกลุ่มแรกเกี่ยวกับการเข้าถึงระบบและข้อมูล มาตรา 5 คือการเข้าถึงระบบคอมพิวเตอร์ที่มีมาตรการป้องกันโดยมิชอบ โทษจำคุกไม่เกิน 6 เดือน หรือปรับไม่เกิน 10,000 บาท มาตรา 6 คือการล่วงรู้มาตรการป้องกัน เช่น รหัสผ่าน แล้วนำไปเปิดเผยโดยมิชอบ และมาตรา 7 คือการเข้าถึงข้อมูลคอมพิวเตอร์ที่มีมาตรการป้องกันโดยมิชอบ','ความผิดกลุ่มที่สองคือการดักรับ ทำลาย และรบกวน มาตรา 8 ห้ามดักรับข้อมูลคอมพิวเตอร์ของผู้อื่นที่อยู่ระหว่างส่ง มาตรา 9 ห้ามทำให้เสียหาย ทำลาย แก้ไข หรือเพิ่มเติมข้อมูลของผู้อื่น มาตรา 10 ห้ามกระทำให้ระบบของผู้อื่นทำงานผิดปกติหรือหยุดชะงัก เช่น การโจมตีให้ระบบล่ม มาตรา 11 ห้ามส่งข้อมูลรบกวนโดยปกปิดหรือปลอมแหล่งที่มา และมาตรา 13 ห้ามจำหน่ายหรือเผยแพร่ชุดคำสั่งที่ใช้เป็นเครื่องมือกระทำความผิด','ความผิดเกี่ยวกับเนื้อหา มาตรา 14 ห้ามนำเข้าข้อมูลคอมพิวเตอร์ปลอมหรือเท็จโดยทุจริตหรือหลอกลวง ที่น่าจะเกิดความเสียหายต่อผู้อื่นหรือประชาชน รวมถึงข้อมูลเท็จที่ก่อให้เกิดความเสียหายต่อความมั่นคงหรือเศรษฐกิจ หรือก่อให้เกิดความตื่นตระหนก โทษจำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ ส่วนมาตรา 16 เกี่ยวกับการนำภาพของผู้อื่นที่ตัดต่อหรือดัดแปลงไปเผยแพร่จนทำให้เสียชื่อเสียง ถูกดูหมิ่น เกลียดชัง หรืออับอาย','หน้าที่ของผู้ให้บริการ มาตรา 26 กำหนดให้ผู้ให้บริการต้องเก็บข้อมูลจราจรทางคอมพิวเตอร์ไว้ไม่น้อยกว่า 90 วัน นับแต่วันที่ข้อมูลนั้นเข้าสู่ระบบ ข้อมูลจราจรคือข้อมูลเกี่ยวกับการติดต่อสื่อสาร เช่น ต้นทาง ปลายทาง เวลา และประเภทบริการ เพื่อให้สามารถสืบหาผู้กระทำความผิดได้ นอกจากนี้ ผู้ให้บริการที่จงใจสนับสนุนหรือยินยอมให้มีการกระทำความผิดอาจต้องรับโทษเช่นเดียวกับผู้กระทำ','แนวปฏิบัติสำหรับผู้ประกอบวิชาชีพไอที คือ เข้าระบบเฉพาะเมื่อได้รับอนุญาต ไม่แชร์หรือเปิดเผยรหัสผ่าน กำหนดสิทธิ์ตามหน้าที่ เก็บบันทึกการเข้าใช้งาน และขอหนังสืออนุญาตเป็นลายลักษณ์อักษรก่อนทดสอบเจาะระบบทุกครั้ง'],
ws:['สรุปความผิดตามมาตรา 5, 6 และ 7 และอธิบายความแตกต่างของแต่ละมาตราด้วยคำพูดของตนเอง','ยกตัวอย่างสถานการณ์จริงที่อาจผิดตามมาตรา 14 และมาตรา 16 อย่างละ 1 กรณี พร้อมอธิบายเหตุผล','อธิบายหน้าที่ของผู้ให้บริการเกี่ยวกับการเก็บข้อมูลจราจร (ระยะเวลาและความหมาย) และเหตุผลที่กฎหมายกำหนด','วิเคราะห์กรณี: นักศึกษาแอบจำรหัสผ่านของเพื่อนแล้วล็อกอินเข้าบัญชีระบบเรียนออนไลน์ของเพื่อนโดยไม่ได้รับอนุญาต เป็นความผิดหรือไม่ มาตราใด เพราะเหตุใด','เสนอแนวปฏิบัติอย่างน้อย 5 ข้อ สำหรับผู้ดูแลระบบ เพื่อไม่ให้ตนเองกระทำผิดและเพื่อป้องกันองค์กร'],
ex:[
['ข้อใดเป็นการเข้าถึงระบบคอมพิวเตอร์โดยมิชอบตามมาตรา 5',['ใช้โน้ตบุ๊กของตนเองเปิดดูไฟล์ที่ตนเองสร้างไว้ ตามความเหมาะสม','ใช้รหัสผ่านที่ได้มาแอบเข้าระบบของบริษัทโดยไม่ได้รับอนุญาต','เปิดเว็บไซต์ของหน่วยงานที่เปิดให้ประชาชนเข้าชมทั่วไป เป็นหลัก','ล็อกอินบัญชีของตนเองด้วยรหัสผ่านที่ตนตั้งไว้เอง ตามความเหมาะสม','ใช้คอมพิวเตอร์ห้องเรียนตามที่ครูอนุญาตให้ใช้งาน เป็นหลัก']],
['การล่วงรู้รหัสผ่านของผู้อื่นแล้วเปิดเผยโดยมิชอบ เป็นความผิดตามมาตราใด',['มาตรา 5 การเข้าถึงระบบคอมพิวเตอร์โดยมิชอบ','มาตรา 9 การทำลายข้อมูลคอมพิวเตอร์ของผู้อื่น','มาตรา 10 การขัดขวางการทำงานของระบบคอมพิวเตอร์','มาตรา 6 การเปิดเผยมาตรการป้องกันการเข้าถึง','มาตรา 26 การเก็บข้อมูลจราจรทางคอมพิวเตอร์']],
['ผู้ให้บริการต้องเก็บข้อมูลจราจรทางคอมพิวเตอร์ไว้นานเท่าใด เป็นอย่างน้อย',['90 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','30 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','60 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','180 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ','365 วัน นับแต่วันที่ข้อมูลเข้าสู่ระบบ']],
['การดักรับข้อมูลคอมพิวเตอร์ของผู้อื่นที่อยู่ระหว่างส่ง (มาตรา 8) เปรียบได้กับข้อใด',['การเปิดดูเว็บไซต์ข่าวที่เปิดให้ทุกคนอ่านได้ทั่วไป','การสำรองข้อมูลของตนเองไว้ในฮาร์ดดิสก์ภายนอก เป็นหลัก','การส่งอีเมลถึงเพื่อนร่วมงานในองค์กรเดียวกัน เป็นหลัก','การติดตั้งโปรแกรมป้องกันไวรัสบนเครื่องของตนเอง เป็นหลัก','การแอบเปิดอ่านจดหมายของผู้อื่นระหว่างทางถึงปลายทาง']],
['การส่งข้อมูลจำนวนมากให้ระบบของผู้อื่นล่มหรือใช้งานไม่ได้ เป็นความผิดฐานใด',['ดักรับข้อมูลคอมพิวเตอร์ระหว่างการส่งถึงกัน','เปิดเผยรหัสผ่านของผู้อื่นโดยไม่ได้รับอนุญาต','ขัดขวางหรือรบกวนการทำงานของระบบคอมพิวเตอร์','ตัดต่อภาพของผู้อื่นจนทำให้เกิดความเสียหาย','เก็บข้อมูลจราจรไม่ครบตามระยะเวลาที่กำหนด']],
['ความผิดตามมาตรา 14 (นำเข้าข้อมูลคอมพิวเตอร์อันเป็นเท็จ) มีอัตราโทษสูงสุดตามข้อใด',['จำคุกไม่เกิน 6 เดือน หรือปรับไม่เกิน 10,000 บาท หรือทั้งจำทั้งปรับ','จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท หรือทั้งจำทั้งปรับ','จำคุกไม่เกิน 1 ปี หรือปรับไม่เกิน 20,000 บาท หรือทั้งจำทั้งปรับ','ปรับไม่เกิน 5,000 บาท โดยไม่มีโทษจำคุกแต่อย่างใดทั้งสิ้น','จำคุกไม่เกิน 10 ปี หรือปรับไม่เกิน 1,000,000 บาท หรือทั้งจำทั้งปรับ']],
['การสร้างเว็บไซต์ปลอมเลียนแบบธนาคารเพื่อหลอกให้กรอกข้อมูล (Phishing) มีสถานะอย่างไร',['เป็นเพียงมารยาทที่ไม่เหมาะสมทางสังคมเท่านั้น ตามลักษณะของงานนั้น','ผิดเฉพาะเมื่อผู้ถูกหลอกเป็นข้าราชการเท่านั้น ในเบื้องต้น','ไม่ผิดถ้ายังไม่มีผู้ใดสูญเสียเงินจริงๆ เลย ตามลักษณะของงานนั้น','ผิดเฉพาะเมื่อเว็บไซต์ตั้งอยู่นอกประเทศไทยเท่านั้น เป็นหลัก','ผิดฐานนำเข้าข้อมูลปลอมที่น่าจะเกิดความเสียหายต่อผู้อื่น']],
['การตัดต่อภาพผู้อื่นแล้วโพสต์จนทำให้เสื่อมเสียชื่อเสียง (มาตรา 16) ข้อใดถูกต้อง',['ผิด หากทำให้ผู้ถูกตัดต่อเสียชื่อเสียง ถูกดูหมิ่น เกลียดชัง หรืออับอาย','ไม่ผิดถ้าผู้โพสต์ระบุไว้ว่าเป็นเพียงเรื่องล้อเล่นสนุกๆ ตามความเหมาะสม','ไม่ผิดถ้าภาพต้นฉบับหาได้ทั่วไปจากอินเทอร์เน็ตอยู่แล้ว ตามลักษณะของงานนั้น','ไม่ผิดถ้าลบภาพออกภายในหนึ่งสัปดาห์หลังจากเผยแพร่ ตามที่ผู้เกี่ยวข้องตกลงกัน','ไม่ผิดถ้าผู้ถูกตัดต่อเป็นบุคคลที่ผู้โพสต์ไม่รู้จักกันมาก่อน โดยทั่วไป']],
['ข้อมูลจราจรทางคอมพิวเตอร์หมายถึงข้อใด',['เนื้อหาในอีเมลที่ผู้ใช้เขียนส่งถึงกันและกัน โดยทั่วไป','รหัสผ่านที่ผู้ใช้ตั้งไว้สำหรับเข้าสู่ระบบ ตามความเหมาะสม','ไฟล์งานที่ผู้ใช้บันทึกไว้ในเครื่องของตนเอง ในเบื้องต้น','ข้อมูลการติดต่อสื่อสาร เช่น ต้นทาง ปลายทาง และเวลา','ภาพถ่ายที่ผู้ใช้อัปโหลดขึ้นสื่อสังคมออนไลน์ เป็นหลัก']],
['การส่งอีเมลโฆษณาจำนวนมากโดยปกปิดแหล่งที่มา จนผู้รับปฏิเสธไม่ได้ จัดเป็นความผิดตามข้อใด',['ตัดต่อภาพของผู้อื่นให้เสื่อมเสียชื่อเสียง','ดักรับข้อมูลของผู้อื่นที่อยู่ระหว่างการส่ง','ส่งข้อมูลรบกวนโดยปกปิดหรือปลอมแหล่งที่มา','เข้าถึงข้อมูลที่มีมาตรการป้องกันโดยมิชอบ','เปิดเผยรหัสผ่านของผู้อื่นโดยไม่ได้รับอนุญาต']],
['พนักงานไอทีใช้รหัสผ่านของหัวหน้าที่จำได้ เข้าระบบเงินเดือนดูข้อมูลเพื่อนร่วมงานโดยไม่ได้รับอนุญาต แม้ไม่ได้แก้ไขข้อมูลใดๆ ผลเป็นอย่างไร',['ไม่ผิดเพราะไม่ได้ทำให้ข้อมูลเสียหายหรือเปลี่ยนแปลง โดยทั่วไป','ไม่ผิดเพราะรหัสผ่านเป็นของบุคคลในองค์กรเดียวกัน เป็นหลัก','อาจผิดฐานเข้าถึงระบบหรือข้อมูลที่มีมาตรการป้องกันโดยมิชอบ','ผิดเฉพาะเมื่อนำข้อมูลที่ดูไปเผยแพร่ต่อสาธารณะเท่านั้น เป็นหลัก','ผิดเฉพาะเมื่อมีผู้เสียหายแจ้งความภายในสามวันเท่านั้น เป็นหลัก']],
['ผู้ให้บริการเว็บบอร์ดทราบว่ามีผู้โพสต์เนื้อหาผิดกฎหมาย แต่จงใจยินยอมไม่ลบออก ผลเป็นอย่างไร',['อาจต้องรับโทษเช่นเดียวกับผู้กระทำความผิดนั้น โดยทั่วไป','ไม่ต้องรับผิดเพราะเป็นเพียงผู้ให้พื้นที่โพสต์เท่านั้น','รับผิดเฉพาะค่าธรรมเนียมทางปกครองเล็กน้อยเท่านั้น','รับผิดเฉพาะเมื่อตนเองเป็นผู้พิมพ์ข้อความนั้นเอง','รับผิดเฉพาะเมื่อมีผู้โพสต์เกินหนึ่งร้อยคนขึ้นไป']],
['ข้อใดทำให้การทดสอบเจาะระบบ (Penetration Test) ไม่เป็นความผิด',['ได้รับอนุญาตด้วยวาจาจากพนักงานบางคนในองค์กร ในเบื้องต้น','ทดสอบในช่วงกลางคืนที่ไม่มีผู้ใช้งานระบบอยู่เลย','ไม่ทำลายหรือแก้ไขข้อมูลใดๆ ในระบบที่ทดสอบ โดยทั่วไป','มีเจตนาดีที่จะแจ้งช่องโหว่ให้เจ้าของระบบภายหลัง','ได้รับมอบอำนาจเป็นลายลักษณ์อักษรจากเจ้าของระบบก่อน']],
['ผู้ให้บริการอินเทอร์เน็ตเก็บบันทึกการใช้งานของผู้ใช้เพียง 30 วันแล้วลบทิ้ง ข้อใดถูกต้อง',['ถูกต้อง เพราะ 30 วันเพียงพอตามที่กฎหมายกำหนดแล้ว','อาจฝ่าฝืนหน้าที่เก็บข้อมูลจราจรไม่น้อยกว่า 90 วัน','ถูกต้อง เพราะการเก็บข้อมูลจราจรเป็นไปตามความสมัครใจ','ถูกต้อง เพราะผู้ใช้ร้องขอให้ลบข้อมูลทุกเดือนอยู่แล้ว','ไม่เกี่ยวข้อง เพราะกฎหมายนี้ใช้กับธนาคารเท่านั้น']],
['ข้อใดเข้าข่ายการทำให้ข้อมูลของผู้อื่นเสียหายตามมาตรา 9',['ลบไฟล์ของตนเองที่ไม่ต้องการแล้วออกจากเครื่อง ตามความเหมาะสม','สำรองข้อมูลโครงการของลูกค้าตามที่ได้รับมอบหมาย ตามลักษณะของงานนั้น','อัปเดตซอฟต์แวร์ของเครื่องตนเองตามที่ผู้ผลิตแนะนำ ในเบื้องต้น','ลบฐานข้อมูลลูกค้าของคู่แข่งหลังแอบเข้าระบบด้วยรหัสที่ขโมยมา','ติดตั้งแอนตี้ไวรัสในเครื่องของโรงเรียนตามคำสั่งครู เป็นหลัก']],
['ข้อใดอธิบายความสัมพันธ์ระหว่างฉบับ พ.ศ. 2550 กับฉบับที่ 2 พ.ศ. 2560 ได้ถูกต้อง',['ฉบับ 2560 ยกเลิกฉบับ 2550 แล้วใช้ชื่อใหม่ทั้งฉบับ','ฉบับ 2560 ใช้เฉพาะกับหน่วยงานของรัฐเท่านั้น','ฉบับ 2560 ใช้เฉพาะกับผู้ให้บริการอินเทอร์เน็ตเท่านั้น','ฉบับ 2560 ถูกยกเลิกแล้วให้กลับไปใช้ฉบับ 2550','ฉบับ 2560 แก้ไขเพิ่มเติมฉบับ 2550 และใช้ควบคู่กัน']],
['ฟรีแลนซ์เขียนสคริปต์ขโมยรหัสผ่านแล้วขายให้ผู้อื่นนำไปเจาะบัญชี ข้อใดถูกต้อง',['อาจผิดฐานจำหน่ายหรือเผยแพร่ชุดคำสั่งที่ใช้กระทำความผิด','ไม่ผิดเพราะเป็นเพียงผู้เขียนโปรแกรมไม่ได้เจาะเอง เป็นหลัก','ไม่ผิดเพราะโปรแกรมไม่ได้ติดตั้งในเครื่องของผู้ขาย','ไม่ผิดเพราะผู้ซื้อตกลงรับผิดชอบการใช้งานเองทั้งหมด เป็นหลัก','ไม่ผิดเพราะขายผ่านช่องทางส่วนตัวที่ไม่เปิดเผยทั่วไป']],
['ข้อใดเป็นแนวปฏิบัติที่ดีที่สุดเพื่อป้องกันความผิดตามกฎหมายนี้ในงานดูแลระบบ',['ใช้บัญชีผู้ดูแลระบบร่วมกันทุกคนเพื่อความสะดวก ในเบื้องต้น','จดรหัสผ่านติดไว้ที่หน้าจอเพื่อให้ทีมเข้าถึงได้เร็ว เป็นหลัก','กำหนดสิทธิ์ตามหน้าที่และเก็บบันทึกการเข้าใช้งานไว้ตรวจสอบ','ให้พนักงานใหม่ใช้รหัสของรุ่นพี่ไปก่อนช่วงทดลองงาน โดยทั่วไป','ปิดการบันทึกล็อกเพื่อลดภาระพื้นที่จัดเก็บข้อมูลของระบบ']],
['ผู้ใช้โพสต์ข่าวปลอมว่าธนาคารจะล้มภายในวันนี้ จนผู้คนแห่ถอนเงินด้วยความตื่นตระหนก ข้อใดถูกต้อง',['เป็นเพียงการแสดงความเห็นส่วนตัวที่ไม่มีความผิด ตามลักษณะของงานนั้น','อาจผิดฐานนำเข้าข้อมูลเท็จที่น่าจะเกิดความเสียหายแก่ประชาชน โดยทั่วไป','ผิดเฉพาะเมื่อผู้โพสต์เป็นพนักงานของธนาคารนั้นเท่านั้น เป็นหลัก','ผิดเฉพาะเมื่อผู้ถอนเงินรวมกันเกินหนึ่งล้านบาทเท่านั้น เป็นหลัก','ไม่ผิดเพราะผู้โพสต์ไม่ได้รับประโยชน์ตอบแทนโดยตรง ตามความเหมาะสม']],
['เหตุผลหลักที่กฎหมายกำหนดให้ผู้ให้บริการเก็บข้อมูลจราจรทางคอมพิวเตอร์คือข้อใด',['เพื่อให้ผู้ให้บริการนำไปขายต่อเป็นรายได้เสริม โดยทั่วไป','เพื่อใช้ตรวจเนื้อหาส่วนตัวของผู้ใช้ทุกคนทุกวัน โดยทั่วไป','เพื่อลดภาระของอินเทอร์เน็ตความเร็วสูงในประเทศ','เพื่อเป็นหลักฐานสืบหาตัวผู้กระทำความผิดเมื่อเกิดเหตุ','เพื่อใช้แทนการลงทะเบียนผู้ใช้ด้วยบัตรประชาชน โดยทั่วไป']]
]};
C[3]={
art:['พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA) เป็นกฎหมายที่คุ้มครองสิทธิในข้อมูลส่วนบุคคลของบุคคลธรรมดา ข้อมูลส่วนบุคคลคือข้อมูลเกี่ยวกับบุคคลที่ทำให้สามารถระบุตัวบุคคลนั้นได้ ไม่ว่าทางตรงหรือทางอ้อม เช่น ชื่อ เลขบัตรประชาชน เบอร์โทรศัพท์ อีเมล ทั้งนี้ ข้อมูลของนิติบุคคลและข้อมูลของผู้ถึงแก่กรรมไม่ถือเป็นข้อมูลส่วนบุคคลตามกฎหมายนี้','กฎหมายนี้กำหนดบทบาทสำคัญ 3 ฝ่าย คือ เจ้าของข้อมูล (Data Subject) คือบุคคลที่ข้อมูลระบุถึง ผู้ควบคุมข้อมูล (Data Controller) คือผู้มีอำนาจตัดสินใจเกี่ยวกับการเก็บ ใช้ หรือเปิดเผยข้อมูล และผู้ประมวลผลข้อมูล (Data Processor) คือผู้ดำเนินการตามคำสั่งหรือในนามของผู้ควบคุม หากผู้ประมวลผลทำนอกเหนือคำสั่ง อาจต้องรับผิดในฐานะผู้ควบคุมสำหรับการกระทำนั้น','ข้อมูลอ่อนไหว (Sensitive Data) เช่น เชื้อชาติ ศาสนา ความคิดเห็นทางการเมือง ข้อมูลสุขภาพ ประวัติอาชญากรรม ข้อมูลพันธุกรรม และข้อมูลชีวภาพ ต้องได้รับการคุ้มครองเข้มงวดกว่าปกติ โดยทั่วไปต้องได้รับความยินยอมโดยชัดแจ้งก่อนเก็บ ใช้ หรือเปิดเผย ผู้ประกอบวิชาชีพไอทีจึงต้องเก็บข้อมูลเท่าที่จำเป็น และไม่เก็บข้อมูลอ่อนไหวหากไม่มีเหตุจำเป็น','การเก็บ ใช้ หรือเปิดเผยข้อมูลต้องมีฐานทางกฎหมายรองรับ เช่น ความยินยอมของเจ้าของข้อมูล การปฏิบัติตามสัญญา การปฏิบัติตามกฎหมาย หรือประโยชน์โดยชอบด้วยกฎหมาย ความยินยอมต้องขอแยกชัดเจน ระบุวัตถุประสงค์ และเจ้าของข้อมูลต้องมีทางเลือกที่จะไม่ให้ได้ รวมทั้งถอนความยินยอมได้ภายหลัง เจ้าของข้อมูลมีสิทธิ เช่น เข้าถึงและขอรับสำเนา แก้ไข ลบหรือทำลาย คัดค้าน ระงับการใช้ และขอโอนย้ายข้อมูล','ผู้ควบคุมข้อมูลต้องจัดให้มีมาตรการรักษาความมั่นคงปลอดภัยที่เหมาะสม เมื่อเกิดเหตุละเมิดข้อมูลที่มีความเสี่ยงต่อสิทธิของบุคคล ต้องแจ้งสำนักงานคณะกรรมการคุ้มครองข้อมูลส่วนบุคคลภายใน 72 ชั่วโมงนับแต่ทราบเหตุ การฝ่าฝืนอาจมีทั้งความรับผิดทางแพ่ง โทษอาญา และโทษปรับทางปกครอง ส่วนการเก็บข้อมูลเพื่อประโยชน์ส่วนตนหรือในครอบครัวได้รับการยกเว้นไม่อยู่ภายใต้กฎหมายนี้'],
ws:['อธิบายความหมายของข้อมูลส่วนบุคคลและข้อมูลอ่อนไหว พร้อมยกตัวอย่างอย่างละ 3 ตัวอย่าง','เปรียบเทียบเจ้าของข้อมูล ผู้ควบคุมข้อมูล และผู้ประมวลผลข้อมูล โดยยกตัวอย่างจากระบบเว็บไซต์ของวิทยาลัยหรือร้านค้าออนไลน์','อธิบายสิทธิของเจ้าของข้อมูลอย่างน้อย 4 สิทธิ พร้อมยกตัวอย่างสถานการณ์ที่ใช้สิทธินั้น','ร่างข้อความขอความยินยอมสำหรับแบบฟอร์มสมัครสมาชิกเว็บไซต์ โดยระบุข้อมูลที่เก็บ วัตถุประสงค์ ระยะเวลาเก็บ และสิทธิในการถอนความยินยอม','ระบบของบริษัทถูกแฮกและข้อมูลลูกค้ารั่วไหล อธิบายขั้นตอนที่ผู้ควบคุมข้อมูลควรปฏิบัติตามลำดับ พร้อมเหตุผล'],
ex:[
['ข้อใดคือความหมายของข้อมูลส่วนบุคคลตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล',['ข้อมูลของบริษัทที่จดทะเบียนเป็นนิติบุคคลทุกแห่ง','ข้อมูลของผู้ที่เสียชีวิตไปแล้วซึ่งไม่มีทายาทดูแล','ข้อมูลเกี่ยวกับบุคคลที่ทำให้ระบุตัวบุคคลนั้นได้','ข้อมูลสถิติรวมที่ไม่อาจระบุถึงตัวบุคคลใดได้เลย','ข้อมูลทั่วไปที่ลงไว้ในหนังสือพิมพ์รายวันทั่วไป']],
['เจ้าของข้อมูลส่วนบุคคล (Data Subject) คือผู้ใด',['บุคคลธรรมดาซึ่งข้อมูลนั้นระบุถึงตัวบุคคลนั้น','บริษัทที่เก็บรวบรวมข้อมูลของลูกค้าไว้ในระบบ','ผู้พัฒนาระบบฐานข้อมูลที่ใช้จัดเก็บข้อมูลดังกล่าว','เจ้าหน้าที่ที่มีหน้าที่ตรวจสอบการปฏิบัติตามกฎหมาย','ผู้ให้บริการคลาวด์ที่เก็บข้อมูลไว้บนเซิร์ฟเวอร์']],
['ข้อใดเป็นข้อมูลอ่อนไหว (Sensitive Data)',['ชื่อและนามสกุลของนักศึกษาในระบบทะเบียน','หมายเลขโทรศัพท์ที่ใช้ติดต่อกับลูกค้าทั่วไป','ที่อยู่อีเมลของผู้สมัครงานตำแหน่งต่างๆ','ชื่อสถานศึกษาที่ผู้สมัครกำลังเรียนอยู่ขณะนี้','ข้อมูลสุขภาพและศาสนาของบุคคลหนึ่งๆ โดยทั่วไป']],
['ผู้ควบคุมข้อมูลส่วนบุคคล (Data Controller) คือผู้ใด',['ผู้ที่ประมวลผลตามคำสั่งโดยไม่มีอำนาจตัดสินใจเอง โดยทั่วไป','ผู้มีอำนาจตัดสินใจเกี่ยวกับการเก็บ ใช้ หรือเปิดเผยข้อมูล','ผู้ที่เป็นเจ้าของข้อมูลซึ่งข้อมูลนั้นระบุถึงตัวบุคคล เป็นหลัก','ผู้ที่เขียนโปรแกรมเว็บไซต์ให้กับหน่วยงานทั่วไปได้ โดยทั่วไป','ผู้ที่เข้าชมเว็บไซต์ของหน่วยงานผ่านอินเทอร์เน็ต เป็นหลัก']],
['พระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคลฉบับนี้ ตราขึ้นในปี พ.ศ. ใด',['พ.ศ. 2540','พ.ศ. 2545 เป็นหลัก','พ.ศ. 2550','พ.ศ. 2562 โดยทั่วไป','พ.ศ. 2566']],
['ข้อใดเป็นสิทธิของเจ้าของข้อมูลส่วนบุคคลตามกฎหมายนี้',['ขอเข้าถึงและขอรับสำเนาข้อมูลของตนที่ผู้ควบคุมเก็บไว้','กำหนดโทษทางอาญาแก่ผู้ควบคุมข้อมูลได้ด้วยตนเอง ตามความเหมาะสม','เรียกดูข้อมูลส่วนบุคคลของบุคคลอื่นในระบบเดียวกัน เป็นหลัก','ห้ามผู้ควบคุมเก็บข้อมูลใดๆ ทุกกรณีโดยไม่มีข้อยกเว้น','กำหนดนโยบายความมั่นคงปลอดภัยของระบบแทนผู้ควบคุม เป็นหลัก']],
['โดยทั่วไป การเก็บข้อมูลส่วนบุคคลต้องมีฐานรองรับตามข้อใด',['ผู้เก็บต้องการข้อมูลไว้ใช้ภายหลังโดยยังไม่ทราบวัตถุประสงค์','เพื่อนของผู้เก็บแนะนำว่าข้อมูลนั้นอาจมีประโยชน์ต่อธุรกิจ','เจ้าของข้อมูลให้ความยินยอมหรือมีฐานตามกฎหมายอื่นรองรับ','ข้อมูลนั้นหาได้ง่ายบนอินเทอร์เน็ตจึงเก็บได้ทันทีโดยอิสระ','ผู้เก็บเป็นบริษัทขนาดใหญ่จึงได้รับการยกเว้นโดยอัตโนมัติ']],
['เมื่อเกิดเหตุละเมิดข้อมูลที่มีความเสี่ยงต่อสิทธิของบุคคล ต้องแจ้งสำนักงานคุ้มครองข้อมูลส่วนบุคคลภายในเวลาใด',['24 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','48 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','96 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น','7 วัน นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้นเป็นต้นไป','72 ชั่วโมง นับแต่ผู้ควบคุมทราบเหตุละเมิดนั้น']],
['ผู้ประมวลผลข้อมูลส่วนบุคคล (Data Processor) คือผู้ใด',['ผู้ตัดสินใจวัตถุประสงค์ของการใช้ข้อมูลด้วยตนเอง ตามความเหมาะสม','ผู้ดำเนินการเกี่ยวกับข้อมูลตามคำสั่งหรือในนามของผู้ควบคุม','ผู้ที่ได้รับสิทธิ์ขายข้อมูลให้บุคคลภายนอกโดยอิสระ เป็นหลัก','ผู้ที่เป็นเจ้าของข้อมูลและเป็นผู้ให้ความยินยอมนั้น ในเบื้องต้น','ผู้ตรวจสอบของรัฐที่ลงพื้นที่ตรวจเยี่ยมสถานประกอบการ โดยทั่วไป']],
['ชื่อและที่ตั้งของบริษัท (นิติบุคคล) มีสถานะตามกฎหมายนี้อย่างไร',['เป็นข้อมูลอ่อนไหวที่ต้องขอความยินยอมทุกครั้งเสมอ','เป็นข้อมูลส่วนบุคคลที่ได้รับการคุ้มครองเต็มรูปแบบ','เป็นข้อมูลที่ห้ามเผยแพร่ในทุกกรณีตามกฎหมายนี้เลย','ไม่ถือเป็นข้อมูลส่วนบุคคลตามกฎหมายนี้โดยตัวมันเอง','เป็นข้อมูลของผู้ตายที่ต้องมีทายาทเป็นผู้ให้ความยินยอม']],
['ร้านซ่อมคอมพิวเตอร์ขอสำเนาบัตรประชาชนลูกค้าทุกคนเก็บไว้ ทั้งที่ไม่จำเป็นต่อการซ่อม ข้อใดถูกต้อง',['ทำได้เพราะเป็นร้านที่ลูกค้าไว้วางใจอยู่แล้ว ในเบื้องต้น','ทำได้เพราะลูกค้าไม่ได้คัดค้านระหว่างรับบริการ ตามความเหมาะสม','ทำได้เพราะข้อมูลบนบัตรเป็นข้อมูลที่เปิดเผยทั่วไป ตามความเหมาะสม','ทำได้ถ้าเก็บไว้ในลิ้นชักที่ล็อกกุญแจอย่างแน่นหนา เป็นหลัก','ขัดหลักเก็บเท่าที่จำเป็น เพราะเกินวัตถุประสงค์ของบริการ']],
['ผู้รับจ้างทำเว็บให้โรงเรียนนำข้อมูลนักเรียนไปให้บริษัทโฆษณาเอง โดยโรงเรียนไม่ได้สั่ง ข้อใดถูกต้อง',['ผู้ประมวลผลทำได้เพราะเป็นผู้ดูแลฐานข้อมูลอยู่แล้ว','ทำได้ถ้าเป็นข้อมูลเพียงชื่อกับห้องเรียนเท่านั้น โดยทั่วไป','อาจถือว่าใช้เกินคำสั่ง และต้องรับผิดในฐานะผู้ควบคุมเอง','ทำได้เมื่อบริษัทโฆษณาจ่ายค่าตอบแทนให้โรงเรียนแล้ว โดยทั่วไป','ทำได้เพราะนักเรียนใช้เว็บไซต์ของโรงเรียนอยู่ทุกวัน โดยทั่วไป']],
['ระบบโรงเรียนถูกแฮกและข้อมูลนักเรียนรั่ว โดยมีความเสี่ยงต่อสิทธิของบุคคล ผู้ควบคุมข้อมูลควรทำอย่างไร',['แจ้งสำนักงานภายใน 72 ชั่วโมง และแจ้งเจ้าของข้อมูลหากเสี่ยงสูง','รอดูสถานการณ์หนึ่งเดือนก่อนตัดสินใจว่าจะแจ้งใครหรือไม่ โดยทั่วไป','แจ้งเฉพาะผู้บริหารภายในและไม่เปิดเผยแก่ผู้ใดภายนอก ตามความเหมาะสม','ลบหลักฐานทั้งหมดเพื่อไม่ให้มีผู้ตรวจสอบพบเหตุการณ์ เป็นหลัก','แจ้งเฉพาะนักเรียนที่ผู้ปกครองร้องเรียนมาก่อนแล้วเท่านั้น ในเบื้องต้น']],
['การขอความยินยอมในเว็บไซต์แบบใดที่ถูกต้องตามหลักของกฎหมายนี้',['ติ๊กถูกให้ล่วงหน้าไว้ในช่องเพื่อประหยัดเวลาของผู้ใช้','ผูกรวมกับการยอมรับข้อตกลงบริการโดยไม่ให้แยกเลือกได้','เขียนถ้อยคำกว้างๆ ให้ใช้ข้อมูลเพื่อวัตถุประสงค์ใดก็ได้','แยกชัดเจน บอกวัตถุประสงค์ และให้เลือกให้หรือไม่ให้ได้','ถือว่ายินยอมโดยปริยายเมื่อผู้ใช้เพียงเข้าเว็บไซต์ต่อ']],
['ผู้ใช้ขอลบบัญชีและข้อมูลของตน โดยตอนสมัครเคยให้ความยินยอมไว้ ข้อใดถูกต้อง',['ปฏิเสธได้เพราะให้ความยินยอมไปแล้วจึงเปลี่ยนไม่ได้','ผู้ใช้ถอนความยินยอมได้ และต้องลบเมื่อไม่มีฐานอื่นเก็บ','ลบได้เฉพาะเมื่อผู้ใช้จ่ายค่าธรรมเนียมการลบข้อมูลก่อน','ลบได้เฉพาะเมื่อผ่านไปอย่างน้อยห้าปีนับแต่วันที่สมัคร','ปฏิเสธได้เสมอเพราะข้อมูลเป็นทรัพย์สินของผู้ให้บริการ เป็นหลัก']],
['ข้อใดสอดคล้องกับหลักเก็บข้อมูลเท่าที่จำเป็นในแบบฟอร์มสมัครฝึกงานออนไลน์',['ขอเลขบัตรประชาชนและกรุ๊ปเลือดของผู้สมัครทุกคน','ขอข้อมูลศาสนาและสถานภาพครอบครัวเพื่อประกอบการคัดเลือก','ขอเฉพาะชื่อ อีเมล และสถานศึกษาที่จำเป็นต่อการติดต่อ','ขอสำเนาทะเบียนบ้านไว้ก่อนเผื่อใช้ในอนาคตภายหลัง','ขอรหัสผ่านโซเชียลมีเดียเพื่อตรวจสอบประวัติเพิ่มเติม']],
['การติดตั้งกล้อง CCTV ในสำนักงาน ข้อใดสอดคล้องกับกฎหมายนี้',['ไม่ต้องแจ้งใครเพราะเป็นพื้นที่ของตนเองทั้งหมด ตามความเหมาะสม','ติดได้ทุกจุดรวมถึงห้องน้ำถ้าเจ้าของอาคารเห็นด้วย ตามลักษณะของงานนั้น','แจ้งเฉพาะเมื่อมีผู้ร้องเรียนการติดตั้งแล้วเท่านั้น เป็นหลัก','เก็บภาพไว้ตลอดไปเพราะเป็นหลักฐานที่อาจมีประโยชน์ ตามลักษณะของงานนั้น','ติดป้ายแจ้งวัตถุประสงค์ กำหนดระยะเวลาเก็บ และจำกัดผู้เข้าถึง']],
['ข้อใดคือการออกแบบระบบให้คุ้มครองข้อมูลตั้งแต่ต้น (Privacy by Design)',['เข้ารหัสข้อมูลสำคัญและจำกัดสิทธิ์เข้าถึงตั้งแต่ขั้นออกแบบ','เพิ่มมาตรการป้องกันหลังจากมีข้อมูลรั่วไหลเกิดขึ้นแล้ว เป็นหลัก','เก็บข้อมูลทุกช่องไว้ก่อนแล้วค่อยลบเมื่อมีผู้ร้องขอภายหลัง','ให้ทุกคนในทีมเข้าถึงฐานข้อมูลจริงเพื่อความสะดวกทดสอบ','เปิดโครงสร้างฐานข้อมูลบนที่สาธารณะเพื่อความโปร่งใสทั้งหมด']],
['กรณีใดได้รับยกเว้นไม่อยู่ภายใต้กฎหมายคุ้มครองข้อมูลส่วนบุคคล',['เก็บข้อมูลลูกค้าของร้านค้าออนไลน์เพื่อใช้จัดส่งสินค้า','เก็บข้อมูลพนักงานของบริษัทเพื่อใช้จ่ายเงินเดือนประจำเดือน','เก็บข้อมูลผู้ป่วยของคลินิกเพื่อใช้ประกอบการรักษาพยาบาล','จดรายชื่อญาติและเพื่อนไว้ใช้เป็นการส่วนตัวภายในครอบครัว','เก็บข้อมูลผู้สมัครงานของบริษัทเพื่อใช้คัดเลือกเข้าทำงาน']],
['การฝ่าฝืนกฎหมายคุ้มครองข้อมูลส่วนบุคคลมีผลอย่างไร',['มีเฉพาะโทษทางแพ่งเท่านั้นและไม่มีโทษทางอื่นใดอีก','อาจมีทั้งความรับผิดทางแพ่ง โทษอาญา และโทษทางปกครอง','มีเฉพาะโทษทางปกครองเท่านั้นและไม่มีโทษทางอื่นใดอีก','มีเฉพาะการตักเตือนด้วยวาจาและบันทึกประวัติไว้เท่านั้น','ไม่มีโทษใดเลยหากไม่ได้กระทำเพื่อหากำไรจากข้อมูลนั้น']]
]};

art:['ลิขสิทธิ์คือสิทธิแต่เพียงผู้เดียวของผู้สร้างสรรค์ในการทำซ้ำ ดัดแปลง และเผยแพร่งานของตน ตาม พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537 ลิขสิทธิ์เกิดขึ้นโดยอัตโนมัติทันทีที่สร้างสรรค์งานขึ้น ไม่ต้องจดทะเบียน และไม่จำเป็นต้องติดเครื่องหมาย © ลิขสิทธิ์คุ้มครอง "การแสดงออก" ของงาน ไม่คุ้มครองความคิด ขั้นตอนวิธี หลักการ หรือทฤษฎี เช่น แนวคิดแอปจองคิวไม่ได้รับความคุ้มครอง แต่ซอร์สโค้ดและหน้าจอที่ออกแบบเฉพาะได้รับความคุ้มครอง','งานที่ได้รับความคุ้มครองมี 9 ประเภท คือ วรรณกรรม นาฏกรรม ศิลปกรรม ดนตรีกรรม โสตทัศนวัสดุ ภาพยนตร์ สิ่งบันทึกเสียง งานแพร่เสียงแพร่ภาพ และงานอื่นใดในแผนกวรรณคดี วิทยาศาสตร์ หรือศิลปะ โปรแกรมคอมพิวเตอร์จัดเป็นงานวรรณกรรม โดยคุ้มครองทั้งซอร์สโค้ดและโค้ดที่ถูกแปลงแล้ว ส่วนงานเว็บไซต์ประกอบด้วยงานหลายประเภท เช่น ข้อความ รูปภาพ วิดีโอ เพลง และโค้ด','สำหรับผู้สร้างสรรค์ที่เป็นบุคคลธรรมดา ลิขสิทธิ์คุ้มครองตลอดชีวิตของผู้สร้างสรรค์และต่อไปอีก 50 ปีนับแต่ผู้สร้างสรรค์ถึงแก่ความตาย ลิขสิทธิ์ตกทอดเป็นมรดกให้ทายาทได้ ส่วนความเป็นเจ้าของลิขสิทธิ์ในงานที่สร้างตามสัญญาจ้างขึ้นอยู่กับประเภทสัญญาและข้อตกลง (ดูมาตรา 9 และ 10) จึงควรเขียนเรื่องลิขสิทธิ์และขอบเขตการใช้งานไว้ในสัญญาให้ชัดเจนเสมอ','การละเมิดลิขสิทธิ์คือการทำซ้ำ ดัดแปลง หรือเผยแพร่งานต่อสาธารณชนโดยไม่ได้รับอนุญาต ในงานไอที เช่น การคัดลอกโปรแกรมเถื่อน การติดตั้งโปรแกรมเกินจำนวนใบอนุญาต การนำรูปภาพจากอินเทอร์เน็ตมาใช้โดยไม่ได้รับสิทธิ์ แม้ไม่มีเครื่องหมาย © หรือลายน้ำก็ยังมีลิขสิทธิ์ การละเมิดเพื่อการค้ามีโทษหนักขึ้น ผู้ฝ่าฝืนอาจต้องรับผิดทั้งทางแพ่งและทางอาญา','ข้อยกเว้นบางกรณีไม่ถือเป็นการละเมิด เช่น การใช้เพื่อการวิจัยหรือศึกษาที่ไม่แสวงหากำไร การวิจารณ์ หรือการรายงานข่าว โดยต้องไม่กระทบสิทธิของเจ้าของลิขสิทธิ์โดยไม่สมควร และควรระบุที่มาเสมอ ในด้านซอฟต์แวร์ มีใบอนุญาตหลายแบบ ได้แก่ ซอฟต์แวร์เชิงพาณิชย์ที่ซื้อใบอนุญาต Freeware ที่ใช้ฟรีแต่เจ้าของยังมีลิขสิทธิ์ และ Open Source เช่น MIT, Apache, GPL ซึ่งมีลิขสิทธิ์และต้องทำตามเงื่อนไข เช่น ระบุชื่อผู้พัฒนา หรือเปิดซอร์สโค้ดของงานที่ดัดแปลงตามที่ GPL กำหนด ภาพและฟอนต์ควรเลือกที่มีใบอนุญาตชัดเจน เช่น Creative Commons หรือซื้อสิทธิ์ใช้งาน'],
ws:['อธิบายหลักการที่ว่าลิขสิทธิ์เกิดขึ้นโดยอัตโนมัติ และสิ่งที่ลิขสิทธิ์ไม่คุ้มครอง (ความคิด) พร้อมตัวอย่างจากงานเว็บไซต์','ยกตัวอย่างงานที่มีลิขสิทธิ์ 5 ประเภทที่พบในการทำเว็บไซต์ (เช่น ข้อความ รูปภาพ วิดีโอ โค้ด เพลง) พร้อมระบุประเภทงานตามกฎหมาย','อธิบายความเสี่ยงของการดาวน์โหลดรูปจากการค้นหาบนอินเทอร์เน็ตมาใช้ในเว็บขายของ และเสนอวิธีหารูปที่ถูกต้องอย่างน้อย 3 วิธี','เปรียบเทียบซอฟต์แวร์เชิงพาณิชย์ Freeware และ Open Source พร้อมตัวอย่างอย่างละ 1 รายการ และข้อควรระวังในการนำไปใช้','วิเคราะห์กรณี: ร้านซ่อมคอมพิวเตอร์ติดตั้งโปรแกรมเถื่อนให้ลูกค้าโดยลูกค้าไม่ทราบ ใครอาจต้องรับผิดและควรแก้ไขอย่างไร'],
ex:[
['ลิขสิทธิ์ตามกฎหมายไทยเกิดขึ้นเมื่อใด',['เมื่อยื่นคำขอจดทะเบียนต่อกรมทรัพย์สินทางปัญญาแล้ว','เมื่อผู้สร้างสรรค์ติดเครื่องหมาย © ไว้บนผลงานนั้น','เมื่อนำผลงานไปเผยแพร่ทางสื่อสังคมออนไลน์แล้ว','เมื่อผู้สร้างสรรค์ได้สร้างสรรค์งานนั้นขึ้นมา','เมื่อมีผู้ซื้อผลงานนั้นไปใช้เป็นครั้งแรกแล้ว']],
['สิ่งใดต่อไปนี้ไม่ได้รับความคุ้มครองตามกฎหมายลิขสิทธิ์',['โค้ดโปรแกรมที่นักพัฒนาเขียนขึ้นเอง โดยทั่วไป','ความคิด วิธีการ หรือหลักการทำงานของระบบ','ภาพถ่ายที่ช่างภาพถ่ายไว้ด้วยตนเอง ในเบื้องต้น','บทความที่นักเขียนเรียบเรียงขึ้นเอง โดยทั่วไป','เพลงที่นักแต่งเพลงประพันธ์ไว้เอง ตามความเหมาะสม']],
['โปรแกรมคอมพิวเตอร์จัดเป็นงานประเภทใดตามกฎหมายลิขสิทธิ์',['งานดนตรีกรรม','งานนาฏกรรม','งานศิลปกรรม','งานโสตทัศนวัสดุ','งานวรรณกรรม']],
['ผู้สร้างสรรค์ที่เป็นบุคคลธรรมดา ลิขสิทธิ์คุ้มครองตลอดชีวิตและต่อไปอีกกี่ปีหลังเสียชีวิต',['50 ปี นับแต่ผู้สร้างสรรค์ถึงแก่ความตาย','10 ปี นับแต่ผู้สร้างสรรค์ถึงแก่ความตาย','20 ปี นับแต่ผู้สร้างสรรค์ถึงแก่ความตาย','70 ปี นับแต่ผู้สร้างสรรค์ถึงแก่ความตาย','100 ปี นับแต่ผู้สร้างสรรค์ถึงแก่ความตาย']],
['ข้อใดเป็นการละเมิดลิขสิทธิ์',['อ่านหนังสือที่ซื้อมาอย่างถูกต้องเพื่อความรู้ส่วนตัว เป็นหลัก','อ้างอิงข้อความสั้นๆ พร้อมระบุที่มาในรายงาน ตามลักษณะของงานนั้น','คัดลอกโปรแกรมเชิงพาณิชย์ไปติดตั้งให้ผู้อื่นโดยไม่ซื้อ','ติดตั้งโปรแกรมที่ซื้อมาลงเครื่องตนเองตามเงื่อนไข เป็นหลัก','ใช้ซอฟต์แวร์โอเพนซอร์สตามเงื่อนไขของใบอนุญาต เป็นหลัก']],
['ซอฟต์แวร์แบบ Freeware ข้อใดถูกต้อง',['ซอร์สโค้ดเปิดให้ทุกคนแก้ไขและขายต่อได้เสมอ เป็นหลัก','ใช้ฟรีแต่เจ้าของยังคงมีลิขสิทธิ์และกำหนดเงื่อนไขได้','ไม่มีลิขสิทธิ์ใดๆ จึงนำไปดัดแปลงขายได้ตลอดไป โดยทั่วไป','ใช้ได้เฉพาะช่วงทดลองแล้วต้องซื้อใบอนุญาตทุกกรณี เป็นหลัก','ตกเป็นสาธารณสมบัติทันทีที่ผู้เขียนปล่อยให้ดาวน์โหลด เป็นหลัก']],
['ซอฟต์แวร์แบบ Open Source ข้อใดถูกต้อง',['ไม่มีลิขสิทธิ์ใดๆ ใช้ได้โดยไม่ต้องทำตามเงื่อนไข ตามความเหมาะสม','ใช้ได้เฉพาะหน่วยงานการศึกษาที่ไม่แสวงหากำไรเท่านั้น เป็นหลัก','ผู้ใช้ต้องจ่ายค่าลิขสิทธิ์ให้ผู้พัฒนาทุกครั้งที่ใช้งาน เป็นหลัก','ยังมีลิขสิทธิ์ และต้องปฏิบัติตามเงื่อนไขใบอนุญาตที่กำหนด','เปิดให้ลบชื่อผู้พัฒนาออกได้เมื่อนำไปเผยแพร่ต่อ ตามลักษณะของงานนั้น']],
['ใบอนุญาตโปรแกรมหนึ่งชุดติดตั้งได้ 1 เครื่อง แต่ร้านติดตั้งลง 10 เครื่อง ผลเป็นอย่างไร',['ไม่ผิดเพราะซื้อใบอนุญาตมาถูกต้องแล้วหนึ่งชุด','ไม่ผิดเพราะใช้ในสำนักงานเดียวกันทั้งหมดทุกเครื่อง','ไม่ผิดถ้าไม่ได้ใช้งานพร้อมกันทุกเครื่องในเวลาเดียวกัน','ไม่ผิดถ้าไม่ได้นำไปขายต่อหรือหากำไรจากโปรแกรมนั้น','อาจละเมิดเพราะใช้เกินจำนวนที่ใบอนุญาตกำหนดไว้']],
['ผลงานที่เผยแพร่ภายใต้ Creative Commons แบบ CC BY ข้อใดถูกต้อง',['ใช้ได้ตามเงื่อนไข โดยต้องระบุชื่อเจ้าของผลงาน','ใช้ได้อย่างอิสระโดยไม่ต้องระบุแหล่งที่มาเลย','ใช้ได้เฉพาะเมื่อได้รับอนุญาตเป็นหนังสือทุกครั้ง','ใช้ได้เฉพาะในหน่วยงานของรัฐและสถานศึกษา','ห้ามใช้ในเว็บไซต์ที่มีโฆษณาหรือรายได้ทุกกรณี']],
['การทำสำเนาผลงานเพื่อการศึกษา ข้อใดถูกต้อง',['ทำสำเนาได้ทั้งเล่มทุกกรณีเพราะใช้เพื่อการเรียน ตามลักษณะของงานนั้น','ทำได้ทุกกรณีหากไม่ได้ขายให้ผู้อื่นเพื่อหากำไร ตามความเหมาะสม','อาจไม่ละเมิดหากเพื่อศึกษา ไม่หากำไร และไม่กระทบสิทธิโดยไม่สมควร','ห้ามทำเด็ดขาดแม้เพียงข้อความสั้นพร้อมอ้างที่มาแล้ว ตามความเหมาะสม','ทำได้เมื่อเป็นครูหรือนักเรียนโดยไม่ต้องมีเงื่อนไขอื่น เป็นหลัก']],
['ร้านค้าโหลดรูปสินค้าจากผลการค้นหาบน Google มาใช้ในเว็บไซต์ของตน ข้อใดถูกต้อง',['เสี่ยงละเมิด เพราะรูปมีเจ้าของลิขสิทธิ์แม้ไม่มีเครื่องหมาย ©','ไม่ผิดเพราะรูปไม่มีเครื่องหมาย © ติดอยู่บนภาพนั้น ตามความเหมาะสม','ไม่ผิดเพราะค้นเจอบนอินเทอร์เน็ตแสดงว่าเปิดให้ใช้ได้ ในเบื้องต้น','ไม่ผิดเพราะลดขนาดไฟล์ภาพให้เล็กกว่าต้นฉบับแล้ว ตามความเหมาะสม','ไม่ผิดเพราะใส่ชื่อเว็บไซต์ของตนทับบนภาพไว้แล้ว ตามลักษณะของงานนั้น']],
['ฟรีแลนซ์ทำเว็บไซต์ให้ลูกค้าโดยไม่ได้เขียนเรื่องลิขสิทธิ์ไว้ในสัญญา ควรทำอย่างไรเพื่อป้องกันข้อพิพาท',['ไม่ต้องทำอะไร เพราะกฎหมายกำหนดตายตัวทุกกรณีอยู่แล้ว เป็นหลัก','ตกลงด้วยวาจา เพราะเชื่อใจกันจึงไม่ต้องเขียนไว้ ตามความเหมาะสม','ให้ลูกค้าฟังเงื่อนไขทางโทรศัพท์แล้วบันทึกเสียงไว้เท่านั้น','ระบุสิทธิ์ลิขสิทธิ์และขอบเขตการใช้ในสัญญาเป็นลายลักษณ์อักษร','ส่งมอบงานก่อนแล้วค่อยตกลงเรื่องลิขสิทธิ์เมื่อเกิดปัญหา เป็นหลัก']],
['นำไลบรารีที่ใช้ใบอนุญาต GPL ไปรวมกับโปรแกรมของตนแล้วจะเผยแพร่ต่อ ข้อใดถูกต้อง',['ไม่ต้องทำตามเงื่อนไขเพราะเป็นไลบรารีที่ใช้ได้ฟรี ตามลักษณะของงานนั้น','ต้องพิจารณาเงื่อนไข GPL ซึ่งอาจบังคับให้เปิดซอร์สโค้ดของงานที่รวมกัน','ลบชื่อผู้พัฒนาไลบรารีออกแล้วใช้ได้อย่างอิสระ ตามที่ผู้เกี่ยวข้องตกลงกัน','ใช้ได้เฉพาะเมื่อจ่ายค่าธรรมเนียมรายปีให้เจ้าของ ตามที่ผู้เกี่ยวข้องตกลงกัน','ใช้ได้เฉพาะในเครื่องตนเองและห้ามเผยแพร่ทุกกรณี ตามที่ผู้เกี่ยวข้องตกลงกัน']],
['บริษัทไม่ทราบว่าพนักงานติดตั้งโปรแกรมเถื่อน ข้อใดเป็นแนวทางป้องกันที่เหมาะสม',['ให้พนักงานรับผิดชอบเองทุกกรณีโดยบริษัทไม่ต้องดูแล ตามความเหมาะสม','ปิดไม่ให้มีการตรวจสอบเครื่องคอมพิวเตอร์ของพนักงาน ตามความเหมาะสม','ซื้อใบอนุญาตเพิ่มเฉพาะเครื่องที่ถูกตรวจพบเท่านั้น ตามความเหมาะสม','ลบโปรแกรมทันทีที่ตรวจพบและไม่ต้องบันทึกอะไรไว้ ตามความเหมาะสม','กำหนดนโยบายห้ามติดตั้งเอง ทำทะเบียนซอฟต์แวร์ และตรวจเป็นระยะ']],
['ข้อใดเป็นแนวทางที่ถูกต้องเมื่อพบโค้ดบน GitHub ที่ไม่มีไฟล์ใบอนุญาต (license)',['ใช้ได้เพราะอยู่ในที่สาธารณะบน GitHub อยู่แล้ว ในเบื้องต้น','ใช้ได้เพราะผู้เขียนเปิดให้ดู repository อย่างเปิดเผย เป็นหลัก','ไม่ควรนำไปใช้ก่อนขออนุญาต เพราะไม่ได้ระบุสิทธิ์การใช้ไว้','ใช้ได้ถ้าเปลี่ยนชื่อตัวแปรบางส่วนในโค้ดเพียงเล็กน้อย','ใช้ได้ถ้าให้ลูกค้ารับผิดชอบเองตามสัญญาจ้างงานนั้น ตามความเหมาะสม']],
['ข้อใดเป็น "การแสดงออก" ที่ได้รับความคุ้มครองลิขสิทธิ์ ไม่ใช่ "ความคิด"',['แนวคิดการทำแอปจองคิวร้านตัดผมออนไลน์','ขั้นตอนวิธีจองคิวในรูปแนวคิดทั่วไป','หลักการทำงานของระบบจองคิวแบบเข้าก่อนได้ก่อน','ซอร์สโค้ดและหน้าจอที่ออกแบบเฉพาะของแอปนั้น','ทฤษฎีทางคณิตศาสตร์ที่ใช้คำนวณคิวของลูกค้า']],
['ลูกค้าส่งรูปมาให้ใช้ในเว็บ โดยยืนยันว่ามีสิทธิ์ แต่จริงๆ เป็นรูปที่ไปนำของผู้อื่นมา ข้อใดถูกต้อง',['ฟรีแลนซ์อาจต้องรับผิดร่วมได้ จึงควรให้ลูกค้ายืนยันสิทธิ์เป็นหนังสือ','ฟรีแลนซ์ไม่ต้องรับผิดเลย เพราะลูกค้าเป็นผู้ส่งภาพมาให้ ตามความเหมาะสม','รับผิดเฉพาะเมื่อได้ค่าจ้างเกินหนึ่งแสนบาทขึ้นไปเท่านั้น เป็นหลัก','รับผิดเฉพาะเมื่อภาพนั้นใช้บนหน้าแรกของเว็บไซต์เท่านั้น ตามความเหมาะสม','ไม่ต้องรับผิดเพราะได้ทำตามคำสั่งของลูกค้าทุกประการ ตามลักษณะของงานนั้น']],
['ข้อใดเป็นวิธีเลือกภาพประกอบเว็บไซต์ที่เหมาะสมที่สุด',['ดาวน์โหลดภาพที่ชอบจากผลการค้นหาแล้วลบลายน้ำออก โดยทั่วไป','คัดลอกภาพจากเว็บคู่แข่งแล้วเปลี่ยนสีให้ต่างไปจากเดิม','ใช้ภาพจากเว็บข่าวโดยไม่ระบุที่มาเพราะเป็นข่าวสาธารณะ','ใช้ภาพที่เพื่อนส่งมาโดยไม่ตรวจสอบแหล่งที่มาเดิมของภาพ','ใช้ภาพที่มีใบอนุญาตชัดเจน เช่น CC หรือซื้อสิทธิ์ใช้ถูกต้อง']],
['ลูกค้าซื้อใบอนุญาตโปรแกรมหนึ่งชุดแล้วทำสำเนาไปขายต่อให้ผู้อื่น ข้อใดถูกต้อง',['ทำได้ เพราะซื้อโปรแกรมนั้นมาเป็นของตนเองแล้ว ตามลักษณะของงานนั้น','อาจละเมิดลิขสิทธิ์ เพราะการซื้อใบอนุญาตไม่ได้โอนลิขสิทธิ์','ทำได้ ถ้าขายถูกกว่าราคาที่ผู้พัฒนาตั้งไว้เดิม ตามความเหมาะสม','ทำได้ ถ้าเปลี่ยนชื่อโปรแกรมก่อนนำไปขายต่อ ตามลักษณะของงานนั้น','ทำได้ ถ้าขายให้เฉพาะคนรู้จักและไม่ขายสาธารณะ ตามความเหมาะสม']],
['เหตุผลสำคัญของการเคารพลิขสิทธิ์ในงานอาชีพไอทีคือข้อใด',['เพื่อลดต้นทุนโดยใช้โปรแกรมเถื่อนแทนของจริง ตามที่ผู้เกี่ยวข้องตกลงกัน','เพื่อให้ทำซ้ำงานได้ง่ายโดยไม่ต้องคิดเอง ตามแนวทางที่หน่วยงานกำหนดไว้เดิม','เพื่อสนับสนุนผู้สร้างสรรค์ ลดความเสี่ยงทางกฎหมาย และสร้างความน่าเชื่อถือ','เพื่อไม่ให้ผู้อื่นใช้ผลงานของตนได้เลยทุกกรณี ตามแนวทางที่หน่วยงานกำหนดไว้เดิม','เพื่อหลีกเลี่ยงการทำสัญญากับลูกค้าทุกกรณี ตามแนวทางที่หน่วยงานกำหนดไว้เดิม']]
]};
C[5]={
art:['ทรัพย์สินทางปัญญาแบ่งได้เป็น 2 กลุ่มใหญ่ คือ ลิขสิทธิ์ และทรัพย์สินอุตสาหกรรม ซึ่งได้แก่ สิทธิบัตร เครื่องหมายการค้า ความลับทางการค้า และอื่นๆ โดยลิขสิทธิ์เกิดขึ้นอัตโนมัติ ขณะที่สิทธิบัตรและเครื่องหมายการค้าต้องยื่นขอและจดทะเบียนกับกรมทรัพย์สินทางปัญญา','สิทธิบัตรแบ่งเป็น 3 ประเภท คือ สิทธิบัตรการประดิษฐ์ คุ้มครอง 20 ปีนับแต่วันยื่นคำขอ สิทธิบัตรการออกแบบผลิตภัณฑ์ คุ้มครองรูปร่างลักษณะภายนอก มีอายุ 10 ปี และอนุสิทธิบัตร อายุ 6 ปี ต่ออายุได้ตามกำหนด การประดิษฐ์ที่ขอสิทธิบัตรได้ต้องมีความใหม่ มีขั้นการประดิษฐ์ที่สูงขึ้น และสามารถประยุกต์ในทางอุตสาหกรรมได้ หากมีผู้ยื่นขอหลายคน ผู้ยื่นก่อนมีสิทธิ์ก่อน','โปรแกรมคอมพิวเตอร์ได้รับความคุ้มครองด้วยกฎหมายลิขสิทธิ์เป็นหลัก ส่วนสิทธิบัตรไม่ให้ความคุ้มครองโปรแกรมคอมพิวเตอร์โดยตัวมันเอง การประดิษฐ์ที่เกี่ยวข้องกับซอฟต์แวร์ต้องพิจารณาเป็นรายกรณี การเปิดเผยรายละเอียดการประดิษฐ์ต่อสาธารณะก่อนยื่นคำขออาจทำให้ขาดความใหม่ จึงควรยื่นคำขอหรือรักษาความลับไว้ก่อน','เครื่องหมายการค้าคือเครื่องหมายที่ใช้กับสินค้าเพื่อให้แตกต่างจากสินค้าของผู้อื่น เครื่องหมายบริการใช้กับบริการ นอกจากนี้ยังมีเครื่องหมายรับรองและเครื่องหมายร่วม ต้องจดทะเบียนจึงได้รับความคุ้มครอง ต้องมีลักษณะบ่งเฉพาะและไม่เหมือนหรือคล้ายกับเครื่องหมายที่ผู้อื่นจดไว้จนสับสน จดแล้วมีอายุ 10 ปี ต่ออายุได้ครั้งละ 10 ปี ก่อนตั้งชื่อแอป ร้านค้า หรือโดเมน ควรตรวจสอบเครื่องหมายที่จดไว้ก่อน','ความลับทางการค้าคือข้อมูลที่ไม่เป็นที่รู้จักโดยทั่วไป มีมูลค่าทางการค้าเพราะเป็นความลับ และเจ้าของใช้มาตรการเหมาะสมรักษาไว้ ตัวอย่างในงานไอที เช่น ซอร์สโค้ดภายในและอัลกอริทึม ฐานข้อมูลลูกค้า แผนธุรกิจ แนวทางป้องกัน ได้แก่ ทำข้อตกลงรักษาความลับ (NDA) กับพนักงานและคู่ค้า กำหนดสิทธิ์เข้าถึงข้อมูลตามหน้าที่ และไม่เปิดเผยข้อมูลสำคัญต่อสาธารณะ'],
ws:['เปรียบเทียบลิขสิทธิ์ สิทธิบัตร และเครื่องหมายการค้า อย่างน้อย 3 ประเด็น (เช่น ต้องจดทะเบียนหรือไม่ สิ่งที่คุ้มครอง อายุความคุ้มครอง)','ยกตัวอย่างสิ่งที่ขอสิทธิบัตรการประดิษฐ์ และสิทธิบัตรการออกแบบผลิตภัณฑ์ในวงการไอที อย่างละ 1 ตัวอย่าง พร้อมเหตุผล','อธิบายเงื่อนไข 3 ข้อของการประดิษฐ์ที่ขอสิทธิบัตรได้ และวิเคราะห์ว่าความคิดทำแอปจองคิวทั่วไปควรได้รับความคุ้มครองแบบใด','ตั้งชื่อแบรนด์ร้านค้าออนไลน์ 1 ชื่อ อธิบายขั้นตอนตรวจสอบก่อนใช้ว่าซ้ำหรือคล้ายกับของผู้อื่นหรือไม่ และเหตุผลที่ควรจดทะเบียน','อธิบายความหมายของความลับทางการค้า พร้อมตัวอย่างในงานไอที 3 ตัวอย่าง และวิธีป้องกัน 3 วิธี'],
ex:[
['ทรัพย์สินทางปัญญาแบ่งเป็นกลุ่มใหญ่ได้ตามข้อใด',['ลิขสิทธิ์ และทรัพย์สินอุตสาหกรรม','สิทธิบัตร และเงินลงทุนในตลาดหลักทรัพย์','ทรัพย์สินส่วนตัว และทรัพย์สินของรัฐ','ลิขสิทธิ์ และทรัพย์สินที่เคลื่อนที่ได้','เครื่องหมายการค้า และสัญญาซื้อขาย']],
['สิทธิบัตรการประดิษฐ์มีอายุความคุ้มครองกี่ปีนับแต่วันยื่นคำขอ',['5 ปี นับแต่วันที่ยื่นคำขอ','10 ปี นับแต่วันที่ยื่นคำขอ เป็นหลัก','15 ปี นับแต่วันที่ยื่นคำขอ','50 ปี นับแต่วันที่ยื่นคำขอ เป็นหลัก','20 ปี นับแต่วันที่ยื่นคำขอ']],
['ข้อใดเป็นเงื่อนไขของการประดิษฐ์ที่ขอสิทธิบัตรได้',['ต้องเป็นสิ่งที่มีผู้ใช้กันแพร่หลายแล้วในตลาด ตามความเหมาะสม','ต้องเป็นความคิดที่ยังไม่ได้สร้างเป็นรูปธรรม ตามความเหมาะสม','ต้องใหม่ มีขั้นการประดิษฐ์สูงขึ้น และประยุกต์ในอุตสาหกรรมได้','ต้องเป็นสิ่งที่ผู้ประดิษฐ์เก็บเป็นความลับตลอดไป ตามความเหมาะสม','ต้องเป็นสิ่งที่ได้รับลิขสิทธิ์มาก่อนแล้วเท่านั้น ตามลักษณะของงานนั้น']],
['เครื่องหมายการค้า ข้อใดถูกต้อง',['ได้รับความคุ้มครองทันทีที่เริ่มใช้ โดยไม่ต้องจดทะเบียน','ต้องจดทะเบียนจึงจะได้รับความคุ้มครองตามกฎหมาย','ใช้ได้เฉพาะกับสินค้าที่เป็นวัตถุจับต้องได้เท่านั้น','ใช้ได้เฉพาะบริษัทขนาดใหญ่ที่จดทะเบียนนิติบุคคล','คุ้มครองถาวรตลอดไปโดยไม่ต้องต่ออายุอีกเลย']],
['เครื่องหมายการค้าที่จดทะเบียนแล้วมีอายุกี่ปี และต่ออายุได้ครั้งละกี่ปี',['5 ปี ต่ออายุได้ครั้งละ 5 ปี','20 ปี ต่ออายุได้ครั้งละ 20 ปี','50 ปี และต่ออายุไม่ได้อีกต่อไป','10 ปี ต่ออายุได้ครั้งละ 10 ปี','15 ปี ต่ออายุได้ครั้งละ 5 ปี']],
['สิทธิบัตรการออกแบบผลิตภัณฑ์คุ้มครองสิ่งใดเป็นหลัก',['หลักการทำงานภายในของผลิตภัณฑ์','ชื่อยี่ห้อของผลิตภัณฑ์ที่ใช้ทางการค้า','รูปร่างลักษณะภายนอกของผลิตภัณฑ์','ขั้นตอนการผลิตในโรงงานของผู้ผลิต','ข้อมูลลูกค้าที่ผู้ผลิตเก็บรวบรวมไว้']],
['ความลับทางการค้าหมายถึงข้อใด',['ข้อมูลที่ไม่เป็นที่รู้ทั่วไป มีมูลค่าทางการค้า และเจ้าของรักษาไว้','ข้อมูลทุกอย่างของบริษัทไม่ว่าจะเปิดเผยแล้วหรือไม่ ตามความเหมาะสม','ข้อมูลที่เผยแพร่อยู่ในเว็บไซต์ของบริษัทอย่างเปิดเผย ตามลักษณะของงานนั้น','ข้อมูลที่หน่วยงานรัฐประกาศในราชกิจจานุเบกษา ตามลักษณะของงานนั้น','ข้อมูลที่ผู้ประกอบการรายอื่นรู้กันทั่วไปในวงการ ตามที่ผู้เกี่ยวข้องตกลงกัน']],
['อนุสิทธิบัตรต่างจากสิทธิบัตรการประดิษฐ์ตามข้อใด',['ใช้ได้เฉพาะกับการออกแบบรูปลักษณ์ภายนอก เป็นหลัก','มีอายุยาวนานกว่าสิทธิบัตรการประดิษฐ์เสมอ เป็นหลัก','ไม่ต้องยื่นคำขอต่อหน่วยงานของรัฐเลย ตามความเหมาะสม','มีอายุสั้นกว่า คือ 6 ปี และต่ออายุได้ตามกำหนด','ใช้ได้เฉพาะนักประดิษฐ์ที่เป็นชาวต่างชาติ เป็นหลัก']],
['โปรแกรมคอมพิวเตอร์ได้รับความคุ้มครองตามกฎหมายใดเป็นหลัก',['กฎหมายเครื่องหมายการค้า','กฎหมายสิทธิบัตรการประดิษฐ์','กฎหมายการออกแบบผลิตภัณฑ์','กฎหมายพันธุ์พืชใหม่','กฎหมายลิขสิทธิ์ โดยทั่วไป']],
['หากมีผู้ยื่นขอสิทธิบัตรสิ่งประดิษฐ์เดียวกันหลายคน ผู้ใดมีสิทธิ์ก่อน',['ผู้ที่ประดิษฐ์ได้ก่อนแต่ไม่ได้ยื่นคำขอ','ผู้ที่ยื่นคำขอก่อน ตามหลักการทั่วไป','ผู้ที่มีเงินทุนมากที่สุดในกลุ่มผู้ยื่น','ผู้ที่เป็นนิติบุคคลตามที่จดทะเบียนไว้','ผู้ที่ใช้งานการประดิษฐ์นั้นมานานที่สุด']],
['ทีมงานเริ่มใช้ชื่อแอป "FastPay" ที่คล้ายกับเครื่องหมายที่จดไว้แล้วในบริการเดียวกัน ข้อใดถูกต้อง',['ใช้ได้เพราะเป็นคนละบริษัทกันอย่างชัดเจน','ใช้ได้เพราะสะกดต่างกันเพียงหนึ่งตัวอักษรเท่านั้น','ใช้ได้เพราะยังไม่มีลูกค้าสับสนในช่วงเริ่มต้นนี้','เสี่ยงถูกฟ้องละเมิด เพราะอาจคล้ายจนสับสนได้','ใช้ได้ถ้าเพิ่มคำว่าเวอร์ชันใหม่ต่อท้ายชื่อนั้น']],
['บริษัทต้องการปกป้องอัลกอริทึมภายในที่ไม่เปิดเผย ควรใช้วิธีใดเป็นหลัก',['จดเครื่องหมายการค้าชื่ออัลกอริทึมเท่านั้น ตามลักษณะของงานนั้น','รักษาเป็นความลับทางการค้าและทำสัญญาห้ามเปิดเผยกับพนักงาน','เผยแพร่โค้ดบนอินเทอร์เน็ตเพื่อให้ได้ลิขสิทธิ์ทันที โดยทั่วไป','ปล่อยให้ใช้กันทั่วไปเพราะกฎหมายคุ้มครองอัตโนมัติ เป็นหลัก','ยื่นสิทธิบัตรการออกแบบผลิตภัณฑ์เพื่อคุ้มครองกฎเกณฑ์']],
['พนักงานลาออกไปเปิดบริษัทใหม่และนำฐานข้อมูลลูกค้าของที่เดิมไปใช้ ข้อใดถูกต้อง',['ทำได้เพราะข้อมูลอยู่ในความจำของพนักงานเอง','ทำได้เพราะลาออกจากบริษัทเดิมโดยสมบูรณ์แล้ว','ทำได้ถ้าบริษัทใหม่ไม่ได้แข่งขันโดยตรงกับที่เดิม','ทำได้ถ้าคัดลอกเพียงบางส่วนของฐานข้อมูลไปใช้','อาจละเมิดความลับทางการค้าและสัญญารักษาความลับ']],
['ก่อนจดชื่อโดเมนสำหรับธุรกิจ ควรตรวจสอบอะไรเพิ่มเติมด้านกฎหมาย',['ตรวจว่าชื่อไม่ชนกับเครื่องหมายการค้าที่จดไว้ในกลุ่มธุรกิจเดียวกัน','ตรวจเพียงว่าชื่อโดเมนยังไม่มีผู้จดมาก่อนในระบบ ตามที่ผู้เกี่ยวข้องตกลงกัน','ตรวจว่าชื่อสั้นพอที่ลูกค้าจะพิมพ์ได้ง่ายเท่านั้น ตามความเหมาะสม','ไม่ต้องตรวจเพราะโดเมนไม่เกี่ยวกับกฎหมายใดเลย ตามลักษณะของงานนั้น','ตรวจว่าชื่อตรงกับชื่อผู้จดทะเบียนทุกตัวอักษรเท่านั้น ตามความเหมาะสม']],
['ทีมนักศึกษาพัฒนาแอปใหม่ ต้องการกันไม่ให้คู่แข่งใช้ชื่อและโลโก้ ควรทำอย่างไร',['ยื่นขอสิทธิบัตรการประดิษฐ์ให้กับชื่อของแอป','ใส่เครื่องหมาย © ที่ชื่อแอปเพื่อให้ได้สิทธิ์ทันที','ยื่นจดทะเบียนเครื่องหมายการค้าสำหรับชื่อและโลโก้','เก็บชื่อแอปเป็นความลับไม่ให้ผู้ใดทราบเลย','ประกาศบนเว็บไซต์ว่าห้ามผู้อื่นใช้ชื่อนี้ทุกกรณี']],
['ข้อใดทำให้การประดิษฐ์ขาดความใหม่ได้ง่ายที่สุด',['เก็บรายละเอียดเป็นความลับจนถึงวันที่ยื่นคำขอ เป็นหลัก','เผยแพร่รายละเอียดครบถ้วนบนอินเทอร์เน็ตก่อนยื่นคำขอ','ปรึกษาที่ปรึกษากฎหมายภายใต้สัญญาห้ามเปิดเผยข้อมูล','บันทึกขั้นตอนการพัฒนาไว้เป็นหลักฐานภายในองค์กร เป็นหลัก','ตรวจสอบสิทธิบัตรเดิมก่อนเริ่มยื่นคำขอจริงเสมอ เป็นหลัก']],
['เครื่องหมายบริการ (Service Mark) คืออะไร',['เครื่องหมายที่ใช้เฉพาะกับสินค้าที่เป็นของจับต้องได้ ในเบื้องต้น','เครื่องหมายที่ใช้รับรองคุณภาพสินค้าของหน่วยงานกลาง โดยทั่วไป','เครื่องหมายที่ใช้ร่วมกันโดยบริษัทในเครือเดียวกันทั้งหมด เป็นหลัก','เครื่องหมายที่ใช้กับบริการเพื่อให้แตกต่างจากบริการของผู้อื่น','เครื่องหมายที่ใช้เฉพาะเว็บไซต์ที่ไม่แสวงหากำไรเท่านั้น เป็นหลัก']],
['บริษัทซอฟต์แวร์ต้องการให้พนักงานรักษาความลับทางการค้า ควรทำอย่างไร',['ทำข้อตกลงรักษาความลับ (NDA) และกำหนดสิทธิ์เข้าถึงข้อมูล','บอกด้วยวาจาในการประชุมครั้งแรกของปีแล้วถือว่าเพียงพอ เป็นหลัก','ให้พนักงานทุกคนใช้บัญชีเดียวกันเพื่อความสะดวกในการทำงาน','เปิดซอร์สโค้ดให้ทุกคนเข้าถึงได้เพื่อความโปร่งใสทั้งหมด เป็นหลัก','ไม่ต้องทำอะไรเพราะกฎหมายป้องกันให้อัตโนมัติอยู่แล้ว ในเบื้องต้น']],
['ข้อใดเป็นตัวอย่างของทรัพย์สินอุตสาหกรรมโดยตรง',['นิยายออนไลน์ที่นักเขียนแต่งขึ้นเอง ตามลักษณะของงานนั้น','ภาพวาดดิจิทัลที่ศิลปินสร้างสรรค์ไว้ ตามความเหมาะสม','เครื่องหมายการค้าที่จดทะเบียนไว้กับกรมทรัพย์สินฯ','เพลงที่นักร้องบันทึกเสียงไว้ในสตูดิโอ ตามลักษณะของงานนั้น','ภาพถ่ายท่องเที่ยวที่ช่างภาพถ่ายไว้เอง โดยทั่วไป']],
['ข้อใดอธิบายความแตกต่างหลักระหว่างลิขสิทธิ์และสิทธิบัตรได้ถูกต้อง',['ลิขสิทธิ์ต้องจดทะเบียน ส่วนสิทธิบัตรไม่ต้องจดทะเบียน เป็นหลัก','ทั้งสองอย่างคุ้มครองความคิดโดยไม่ต้องมีการแสดงออก ตามความเหมาะสม','ลิขสิทธิ์คุ้มครองการประดิษฐ์ใหม่ สิทธิบัตรคุ้มครองงานเขียน เป็นหลัก','ทั้งสองอย่างมีอายุความคุ้มครองเท่ากันในทุกประเภทงาน ตามลักษณะของงานนั้น','ลิขสิทธิ์เกิดอัตโนมัติ ส่วนสิทธิบัตรต้องยื่นขอและได้รับอนุมัติ']]
]};

art:['พระราชบัญญัติว่าด้วยธุรกรรมทางอิเล็กทรอนิกส์ พ.ศ. 2544 (แก้ไขเพิ่มเติมหลายครั้ง) รับรองให้ข้อมูลอิเล็กทรอนิกส์มีผลทางกฎหมายใกล้เคียงกับเอกสารกระดาษ ธุรกรรมทางอิเล็กทรอนิกส์คือธุรกรรมที่ใช้วิธีการทางอิเล็กทรอนิกส์ทั้งหมดหรือบางส่วน เช่น การสั่งซื้อสินค้าผ่านแอป การโอนเงินผ่านธนาคารออนไลน์ การทำสัญญาทางอีเมล','หลักการสำคัญคือ ข้อความจะถูกปฏิเสธผลผูกพันและการบังคับใช้ตามกฎหมายเพียงเพราะอยู่ในรูปข้อมูลอิเล็กทรอนิกส์ไม่ได้ (มาตรา 7) และจะปฏิเสธการรับฟังเป็นพยานหลักฐานเพียงเพราะเป็นข้อมูลอิเล็กทรอนิกส์ไม่ได้ (มาตรา 11) ข้อมูลที่เป็นต้นฉบับต้องคงความครบถ้วนไม่ถูกเปลี่ยนแปลงและแสดงให้เห็นได้ (มาตรา 8)','ลายมือชื่ออิเล็กทรอนิกส์ (มาตรา 9) ใช้แทนลายมือชื่อได้ เมื่อมีวิธีระบุตัวเจ้าของลายมือชื่อ และแสดงได้ว่าเจ้าของรับรองข้อความนั้น โดยวิธีการนั้นเชื่อถือได้เหมาะสมกับวัตถุประสงค์ ตัวอย่างมีตั้งแต่การยืนยันตัวตนด้วยรหัสหรือ OTP ไปจนถึงลายมือชื่อดิจิทัลที่ใช้ใบรับรองจากผู้ให้บริการออกใบรับรอง (CA) ซึ่งยืนยันตัวผู้ลงนามและตรวจพบการแก้ไขข้อความภายหลังได้','การเก็บรักษาข้อความอิเล็กทรอนิกส์ (มาตรา 12) ต้องเข้าถึงและนำกลับมาใช้ได้ คงความครบถ้วนถูกต้อง และเก็บข้อมูลที่ระบุแหล่งกำเนิด ปลายทาง วันและเวลาที่ส่งหรือรับไว้ ระบบสั่งซื้อออนไลน์จึงควรบันทึกผู้ใช้ เวลา รายการ การยืนยันตัวตน และส่งอีเมลยืนยันให้ลูกค้า รวมทั้งป้องกันไม่ให้ผู้ดูแลระบบแก้ไขล็อกโดยไม่มีร่องรอย','ธุรกรรมบางประเภท เช่น เรื่องครอบครัวและมรดก อาจได้รับยกเว้นตามพระราชกฤษฎีกา สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ (สพธอ./ETDA) ทำหน้าที่ส่งเสริมและกำกับดูแลด้านนี้ ผู้ประกอบวิชาชีพไอทีควรออกแบบระบบให้แสดงราคา เงื่อนไข ข้อมูลผู้ขาย และขั้นตอนยกเลิกก่อนลูกค้ายืนยัน รวมทั้งเก็บหลักฐานครบถ้วนเพื่อป้องกันข้อพิพาท'],
ws:['อธิบายหลักการสำคัญของกฎหมายธุรกรรมทางอิเล็กทรอนิกส์ที่ทำให้อีเมลหรือข้อความในแชตใช้เป็นหลักฐานได้ พร้อมยกตัวอย่างสถานการณ์','เปรียบเทียบลายมือชื่ออิเล็กทรอนิกส์แบบทั่วไปกับลายมือชื่อดิจิทัลแบบใช้ใบรับรอง พร้อมตัวอย่างการใช้งานอย่างละ 1 กรณี','ระบุสิ่งที่เว็บไซต์ขายของออนไลน์ควรแสดงให้ผู้ซื้อทราบก่อนสั่งซื้ออย่างน้อย 4 ข้อ และเหตุผลที่ต้องแสดง','วิเคราะห์กรณี: ลูกค้ากดยืนยันสั่งซื้อในแอปแล้วปฏิเสธว่าไม่เคยสั่ง ระบบควรเก็บหลักฐานอะไรบ้างเพื่อพิสูจน์ พร้อมเหตุผล','อธิบายหลักเกณฑ์การเก็บรักษาข้อมูลอิเล็กทรอนิกส์ตามมาตรา 12 และออกแบบวิธีบันทึกธุรกรรมของระบบให้ตรงตามหลักเกณฑ์'],
ex:[
['ข้อใดเป็นธุรกรรมทางอิเล็กทรอนิกส์',['การเซ็นสัญญากระดาษต่อหน้าพยานในสำนักงานทนายความ','การโทรแจ้งยกเลิกบริการด้วยวาจาโดยไม่มีบันทึกใดๆ','การส่งจดหมายลงทะเบียนไปยังที่อยู่ที่ระบุในสัญญา','การจ่ายเงินสดที่เคาน์เตอร์โดยไม่มีบันทึกอิเล็กทรอนิกส์','การสั่งซื้อสินค้าผ่านแอปและชำระเงินผ่านระบบออนไลน์']],
['กฎหมายธุรกรรมทางอิเล็กทรอนิกส์รับรองข้อความในรูปข้อมูลอิเล็กทรอนิกส์อย่างไร',['ไม่มีผลทางกฎหมายหากไม่ได้พิมพ์ลงกระดาษและลงลายมือชื่อ โดยทั่วไป','มีผลเฉพาะธุรกรรมที่มีมูลค่าต่ำกว่าหนึ่งพันบาทเท่านั้น','จะปฏิเสธผลผูกพันเพียงเพราะเป็นข้อมูลอิเล็กทรอนิกส์ไม่ได้','มีผลเฉพาะระหว่างหน่วยงานของรัฐด้วยกันเท่านั้น ในเบื้องต้น','ต้องผ่านการรับรองจากศาลก่อนจึงจะมีผลบังคับใช้ ในเบื้องต้น']],
['ลายมือชื่ออิเล็กทรอนิกส์ใช้แทนลายมือชื่อได้เมื่อใด',['ระบุตัวเจ้าของลายมือชื่อและแสดงว่าเจ้าของรับรองข้อความนั้น','เมื่อสแกนภาพลายเซ็นไปวางไว้ท้ายเอกสารเท่านั้น ในเบื้องต้น','เมื่อพิมพ์ชื่อของตนเองไว้ท้ายข้อความในทุกกรณี ตามลักษณะของงานนั้น','เมื่อมีพยานสองคนลงชื่อรับรองไว้ในเอกสารนั้นด้วย โดยทั่วไป','เมื่อหน่วยงานของรัฐประทับตรารับรองข้อความนั้นแล้ว ตามความเหมาะสม']],
['ใบรับรองอิเล็กทรอนิกส์ (Digital Certificate) ออกโดยผู้ใด',['ธนาคารที่ลูกค้าเปิดบัญชีไว้ทุกแห่งในประเทศ','ผู้ผลิตโทรศัพท์มือถือที่ผู้ใช้ซื้อมาใช้งาน','ผู้พัฒนาเว็บไซต์ที่ผู้ใช้เข้าชมบ่อยที่สุดเท่านั้น','ผู้ให้บริการออกใบรับรอง (CA) ที่น่าเชื่อถือ','ผู้ใช้เองออกให้ตนเองได้โดยไม่ต้องตรวจสอบ']],
['หลักฐานที่เป็นข้อมูลอิเล็กทรอนิกส์ ศาลรับฟังได้หรือไม่',['รับฟังไม่ได้เพราะไม่ใช่เอกสารกระดาษต้นฉบับ ตามลักษณะของงานนั้น','จะปฏิเสธการรับฟังเพียงเพราะเป็นข้อมูลอิเล็กทรอนิกส์ไม่ได้','รับฟังได้เฉพาะคดีแพ่งที่มีทุนทรัพย์สูงมากเท่านั้น ตามความเหมาะสม','รับฟังได้เฉพาะเมื่อพิมพ์ออกมาและทนายความรับรอง ตามความเหมาะสม','รับฟังได้เฉพาะข้อมูลที่เก็บในระบบของหน่วยงานรัฐ ในเบื้องต้น']],
['การเก็บรักษาข้อความอิเล็กทรอนิกส์ที่ดีควรเป็นอย่างไร',['เก็บไว้ในเครื่องส่วนตัวและแก้ไขได้ตามต้องการทุกเมื่อ ในเบื้องต้น','เก็บเฉพาะส่วนที่เห็นว่าสำคัญแล้วลบส่วนอื่นทิ้งทั้งหมด ตามความเหมาะสม','เก็บเฉพาะเนื้อหาโดยไม่ต้องบันทึกวันเวลาหรือผู้ส่งผู้รับ เป็นหลัก','เข้าถึงใช้ซ้ำได้ ครบถ้วนถูกต้อง และระบุที่มา ปลายทาง วันเวลา','เก็บเป็นภาพถ่ายหน้าจอที่ตัดต่อให้อ่านง่ายขึ้นแล้ว ตามความเหมาะสม']],
['ข้อใดเป็นตัวอย่างของการยืนยันตัวตนแบบอิเล็กทรอนิกส์ที่ใช้แทนลายมือชื่อ',['แสตมป์ไปรษณียากรที่ติดบนซองจดหมาย ตามความเหมาะสม','ตราประทับยางประจำสำนักงานบนกระดาษ ตามความเหมาะสม','ลายเซ็นปากกาบนกระดาษที่พิมพ์ออกมาเท่านั้น เป็นหลัก','ตราสัญลักษณ์บริษัทบนกระดาษหัวจดหมาย เป็นหลัก','รหัสยืนยันตัวตนและการรับรองข้อความในแอปธนาคาร']],
['หน่วยงานที่ทำหน้าที่ส่งเสริมและกำกับดูแลธุรกรรมทางอิเล็กทรอนิกส์ของไทยคือข้อใด',['กรมการปกครอง กระทรวงมหาดไทย ตามแนวทางที่หน่วยงานกำหนดไว้เดิม','สำนักงานพัฒนาธุรกรรมทางอิเล็กทรอนิกส์ (สพธอ./ETDA)','สำนักงานที่ดินประจำจังหวัดต่างๆ ตามที่ผู้เกี่ยวข้องตกลงกัน','สำนักงานตำรวจแห่งชาติ ตามที่ผู้เกี่ยวข้องตกลงกัน','กรมสรรพสามิต ตามแนวทางที่หน่วยงานกำหนดไว้เดิม เป็นหลัก']],
['ธุรกรรมใดเป็นตัวอย่างที่อาจได้รับยกเว้นไม่ใช้กฎหมายนี้ตามพระราชกฤษฎีกา',['การซื้อขายสินค้าผ่านเว็บไซต์พาณิชย์อิเล็กทรอนิกส์','การส่งใบเสนอราคาทางอีเมลระหว่างบริษัทสองแห่ง','ธุรกรรมเกี่ยวกับครอบครัวและมรดกบางประเภท','การโอนเงินผ่านแอปธนาคารบนโทรศัพท์มือถือ','การลงทะเบียนเรียนออนไลน์ของสถานศึกษา']],

['ข้อใดเป็นข้อดีของลายมือชื่อดิจิทัลแบบใช้ใบรับรอง (PKI)',['ใช้งานได้โดยไม่ต้องมีผู้ให้บริการหรืออุปกรณ์ใดๆ โดยทั่วไป','ทำให้ข้อความไม่มีความเสี่ยงถูกแก้ไขอีกเลย โดยทั่วไป','ช่วยยืนยันตัวผู้ลงนามและตรวจพบการแก้ไขข้อความภายหลัง','มีผลทางกฎหมายสูงกว่ารัฐธรรมนูญในทุกกรณี โดยทั่วไป','ใช้ได้เฉพาะธนาคารและหน่วยงานของรัฐเท่านั้น เป็นหลัก']],
['ข้อมูลใดที่เว็บไซต์ขายของออนไลน์ควรแสดงให้ผู้ซื้อทราบก่อนสั่งซื้อ',['ข้อมูลส่วนตัวของผู้ซื้อรายอื่นที่เคยสั่งสินค้าเดียวกัน','รหัสผ่านผู้ดูแลระบบเพื่อให้ผู้ซื้อตรวจสอบได้ ในเบื้องต้น','กำไรสุทธิของร้านในแต่ละเดือนที่ผ่านมา ตามลักษณะของงานนั้น','ข้อมูลภายในของพนักงานที่รับผิดชอบการจัดส่ง ตามความเหมาะสม','ราคา เงื่อนไข ข้อมูลผู้ขาย และขั้นตอนการยกเลิกคำสั่งซื้อ']],
['บริษัทเก็บอีเมลสัญญาไว้นาน 10 ปี แต่ไม่มีการป้องกันการแก้ไข ข้อใดถูกต้อง',['เพียงพอ เพราะเก็บไว้นานจึงน่าเชื่อถือที่สุดแล้ว โดยทั่วไป','อาจไม่เพียงพอ เพราะต้องรักษาความครบถ้วนไม่ถูกเปลี่ยนแปลงด้วย','เพียงพอ เพราะกฎหมายกำหนดเพียงให้เก็บเอกสารเท่านั้น โดยทั่วไป','ไม่ต้องเก็บ เพราะผู้รับมีสำเนาเก็บไว้อยู่แล้วทั้งหมด ในเบื้องต้น','เพียงพอ ถ้าเก็บไว้ในเครื่องของพนักงานเพียงคนเดียว ตามลักษณะของงานนั้น']],
['เหตุผลสำคัญของกฎหมายธุรกรรมทางอิเล็กทรอนิกส์คือข้อใด',['เพื่อห้ามทำธุรกรรมที่ไม่ใช่กระดาษทุกประเภท เป็นหลัก','เพื่อให้ธุรกรรมกระดาษมีค่าธรรมเนียมสูงกว่าเดิม','เพื่อให้รัฐเก็บภาษีธุรกรรมออนไลน์ได้อย่างเดียว','เพื่อให้ธุรกรรมออนไลน์น่าเชื่อถือและมีผลทางกฎหมาย','เพื่อให้ผู้ใช้ทุกคนจดทะเบียนก่อนใช้อินเทอร์เน็ต เป็นหลัก']]
]};

/* ===== ระบบ ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,st={ws:[],ex:[]},U=null,tab='a',read={},ex={i:0,a:[]},adm=null,AU=1,AS=null;
async function rpc(fn,a){const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});
 if(!r.ok){let m='เกิดข้อผิดพลาด';try{m=(await r.json()).message||m}catch(_){}throw new Error(m)}const t=await r.text();return t?JSON.parse(t):null}
const FS=()=>document.fullscreenElement||document.webkitFullscreenElement,CANFS=document.fullscreenEnabled||document.webkitFullscreenEnabled;
function goFS(){const e=document.documentElement;try{const p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e);p&&p.catch&&p.catch(()=>{})}catch(_){}}
function fsCheck(){$('#fs').style.display=(me&&me.role==='student'&&CANFS&&!FS())?'flex':'none'}
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,fsCheck));
/* กันคัดลอก/วาง */
['copy','cut','paste','contextmenu','dragstart','drop'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));
document.addEventListener('beforeinput',e=>{if(/Paste|Drop/.test(e.inputType))e.preventDefault()},true);
document.addEventListener('selectstart',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&/^[cvxaups]$/i.test(e.key)||e.key==='F12')e.preventDefault()});
document.addEventListener('input',e=>{const t=e.target;if(t.tagName!=='TEXTAREA'&&t.tagName!=='INPUT')return;
 if(t.value.length-(t._p||0)>20&&!e.isComposing)t.value=t._p||'';t._p=t.value.length?t.value:''});
document.addEventListener('input',e=>{if(e.target._p===undefined)e.target._p=''},true);

async function loadSt(){st=await rpc('app_status',{t:me.t,b:me.b})||st}
async function loadAdm(){adm=await rpc('admin_data',{t:me.t,b:me.b})}
async function doLogin(){goFS();const t=$('#t').value.trim(),b=$('#b').value.trim();$('#e').textContent='';
 try{const r=await rpc('app_login',{t,b});if(!r){$('#e').textContent='รหัสไม่ถูกต้อง';return}
  me={t,b,...r};r.role==='admin'?await loadAdm():await loadSt();render()}catch(x){$('#e').textContent=x.message}}
function logout(){me=null;U=null;AG=null;tab='a';read={};if(FS())(document.exitFullscreen||document.webkitExitFullscreen).call(document);render()}
const hasWs=u=>st.ws.some(w=>w.unit==u),hasEx=u=>st.ex.includes(u);
function render(){fsCheck();$('#app').innerHTML=!me?loginV():me.role==='admin'?adminV():U?unitV():homeV();$('#app').style.maxWidth=me&&me.role==='admin'?'980px':'760px';if(me&&me.role==='admin')adminFill();window.scrollTo(0,0)}

function loginV(){return `<div class="card" style="margin-top:12vh"><h1>ใบงานออนไลน์</h1><div class="mu">31900-1001 กฎหมายในงานอาชีพอุตสาหกรรมดิจิทัลและเทคโนโลยีสารสนเทศ</div>
<p><label>รหัสบน (รหัสนักศึกษา)<input id="t" autocomplete="off" autocapitalize="none" inputmode="text"></label>
<label>รหัสล่าง<input id="b" type="password" autocomplete="off"></label></p><div class="err" id="e"></div>
<button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button></div>`}
function homeV(){let done=0;UNITS.forEach((_,i)=>{if(hasWs(i+1)&&hasEx(i+1))done++});
 return `<h1>สวัสดี ${esc(me.name)}</h1><div class="mu">${esc(me.grp||'')} · เสร็จแล้ว ${done}/15 หน่วย</div><div class="bar" style="margin:8px 0"><i style="width:${done/15*100}%"></i></div>
${UNITS.map((n,i)=>{const u=i+1,ok=!!C[u];return `<div class="card" ${ok?`onclick="U=${u};tab='a';render()" style="cursor:pointer"`:'style="opacity:.5"'}><b>หน่วยที่ ${u}</b> ${esc(n)}<div style="margin-top:4px">
${ok?`<span class="chip ${hasWs(u)?'on':''}">ใบงาน${hasWs(u)?' ✓':''}</span><span class="chip ${hasEx(u)?'on':''}">สอบ${hasEx(u)?' ✓':''}</span>`:'<span class="chip">เร็วๆ นี้</span>'}</div></div>`}).join('')}
<button class="btn g" onclick="logout()">ออกจากระบบ</button>`}
function unitV(){const T=(k,l)=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`;
 return `<button class="btn g" style="margin:0 0 8px" onclick="U=null;render()">← กลับ</button><h2>หน่วยที่ ${U} ${esc(UNITS[U-1])}</h2>
<div class="tabs">${T('a','1 บทความ')}${T('w','2 ใบงาน')}${T('x','3 ข้อสอบ')}</div>${tab==='a'?artV():tab==='w'?wsV():exV()}`}
const lock=m=>`<div class="card" style="text-align:center">🔒 ${m}</div>`;
function artV(){return `<div class="card">${C[U].art.map(p=>`<p>${esc(p)}</p>`).join('')}</div><button class="btn" onclick="read[U]=1;tab='w';render()">อ่านจบแล้ว → ไปทำใบงาน</button>`}
function wsV(){if(hasWs(U))return `<div class="card ok">✓ ส่งใบงานแล้ว</div>`+(st.ws.find(w=>w.unit==U).score!=null?`<div class="card">คะแนนใบงาน: <b>${st.ws.find(w=>w.unit==U).score}</b></div>`:'<div class="card mu">รอครูตรวจใบงาน</div>')+`<button class="btn" onclick="tab='x';render()">ไปทำข้อสอบ →</button>`;
 if(!read[U])return lock('กรุณาอ่านบทความให้จบก่อนทำใบงาน')+`<button class="btn" onclick="tab='a';render()">ไปอ่านบทความ</button>`;
 return C[U].ws.map((q,i)=>`<div class="card"><b>ข้อ ${i+1}.</b> ${esc(q)}<textarea id="w${i}" placeholder="พิมพ์คำตอบ (ห้ามวางข้อความ)"></textarea></div>`).join('')+`<div class="err" id="e"></div><button class="btn" onclick="subWs()">ส่งใบงาน</button>`}
async function subWs(){const a=C[U].ws.map((_,i)=>$('#w'+i).value.trim());
 if(a.some(x=>x.length<15)){$('#e').textContent='กรุณาตอบให้ครบทุกข้อ (อย่างน้อย 15 ตัวอักษร)';return}
 if(!confirm('ยืนยันส่งใบงาน? ส่งแล้วแก้ไขไม่ได้'))return;
 try{await rpc('submit_ws',{t:me.t,b:me.b,u:U,a});await loadSt();render()}catch(x){$('#e').textContent=x.message}}
function exV(){if(!hasWs(U))return lock('ต้องส่งใบงานก่อน จึงจะสอบได้');
 if(hasEx(U))return `<div class="card ok">✓ ส่งใบงานและสอบสำเร็จ</div><button class="btn g" onclick="U=null;render()">กลับหน้าหลัก</button>`;
 if(!ex.on)return `<div class="card"><b>ข้อสอบหน่วยที่ ${U}</b><p>20 ข้อ 5 ตัวเลือก ทำได้ครั้งเดียว ไม่สามารถกลับมาแก้ไขหลังส่ง ควรอยู่ในโหมดเต็มจอตลอดการสอบ</p></div><button class="btn" onclick="ex={on:1,i:0,a:Array(20).fill(null)};render()">เริ่มสอบ</button>`;
 const Q=C[U].ex,q=Q[ex.i],n=ex.a.filter(x=>x!==null).length;
 return `<div class="mu">ข้อ ${ex.i+1}/20 · ตอบแล้ว ${n}</div><div class="bar"><i style="width:${(ex.i+1)/20*100}%"></i></div>
<div class="card"><b>${ex.i+1}. ${esc(q[0])}</b>${q[1].map((o,k)=>`<button class="opt ${ex.a[ex.i]===k?'sel':''}" onclick="ex.a[ex.i]=${k};render()">${L[k]}. ${esc(o)}</button>`).join('')}</div>
<div class="row"><button class="btn g" ${ex.i?'':'disabled'} onclick="ex.i--;render()">← ก่อนหน้า</button>
${ex.i<19?`<button class="btn" onclick="ex.i++;render()">ถัดไป →</button>`:`<button class="btn" ${n<20?'disabled':''} onclick="subEx()">ส่งข้อสอบ</button>`}</div>
<div class="row" style="margin-top:10px;flex-wrap:wrap">${Q.map((_,i)=>`<button class="chip ${ex.a[i]!==null?'on':''}" style="flex:0 0 12%;margin:2px;padding:6px 0;background:none" onclick="ex.i=${i};render()">${i+1}</button>`).join('')}</div>`}
async function subEx(){if(!confirm('ยืนยันส่งข้อสอบ?'))return;
 try{await rpc('submit_exam',{t:me.t,b:me.b,u:U,a:ex.a.map(x=>x+1)});ex={};await loadSt();render()}catch(x){alert(x.message)}}

/* ===== ผู้ตรวจ ===== */
const WSM=20,EXM=20;let AT='sum',AG=null,AF='',AQ='',SK='id',SD=1,AUN=1;
const UL=()=>Object.keys(C).map(Number).sort((a,b)=>a-b);
const gw=(s,u)=>adm.ws.find(w=>w.student==s&&w.unit==u),gx=(s,u)=>adm.ex.find(w=>w.student==s&&w.unit==u);
const col=p=>p>=80?'var(--ok)':p>=50?'#fbbf24':'var(--er)';
function stat(s){let wd=0,wp=0,ws=0,xd=0,xs=0;UL().forEach(u=>{const w=gw(s,u),x=gx(s,u);if(w){wd++;if(w.score==null)wp++;else ws+=w.score}if(x){xd++;xs+=x.score}});
 const n=UL().length,tot=ws+xs,mx=n*(WSM+EXM);return{wd,wp,ws,xd,xs,tot,n,pct:mx?Math.round(tot/mx*100):0}}
const fl=()=>adm.students.filter(s=>(!AF||s.grp==AF)&&(!AQ||(s.id+s.name).includes(AQ)));
const pend=()=>adm.ws.filter(w=>w.score==null&&C[w.unit]).sort((a,b)=>a.unit-b.unit||(a.student>b.student?1:-1));
function adminV(){if(AG)return gradeV();const p=pend().length,T=(k,l)=>`<button class="${AT===k?'on':''}" onclick="AT='${k}';render()">${l}</button>`;
 return `<div class="ah"><h1>ผู้ตรวจงาน</h1><div><button class="chip" onclick="exportCsv()">⬇ CSV</button><button class="chip" onclick="loadAdm().then(render)">↻ รีเฟรช</button><button class="chip" onclick="logout()">ออก</button></div></div>
<div class="tabs">${T('pend','รอตรวจ'+(p?' ('+p+')':''))}${T('sum','สรุปคะแนน')}${T('unit','ตามหน่วย')}</div>${AT==='pend'?'<div id="lst"></div>':`<div id="stats"></div>${fbar()}<div id="lst"></div>`}`}
function fbar(){const gs=[...new Set(adm.students.map(s=>s.grp))];
 return `<div class="row" style="margin:8px 0"><select onchange="AF=this.value;adminFill()"><option value="">ทุกห้อง</option>${gs.map(g=>`<option ${AF==g?'selected':''}>${esc(g)}</option>`).join('')}</select><input placeholder="ค้นหาชื่อ / รหัส" value="${esc(AQ)}" oninput="AQ=this.value.trim();adminFill()"></div>`}
function adminFill(){if(AG||!me||me.role!=='admin')return;AT==='pend'?pendList():AT==='unit'?unitList():sumList()}
const stBox=a=>`<div class="stats">${a.map(([l,v])=>`<div class="st"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
function sumList(){const S=fl().map(s=>({s,...stat(s.id)})),n=UL().length,k=S.length;
 $('#stats').innerHTML=stBox([['นักศึกษา',k],['ส่งใบงานแล้ว',S.reduce((a,x)=>a+x.wd,0)+'/'+k*n],['รอตรวจ',S.reduce((a,x)=>a+x.wp,0)],['สอบแล้ว',S.reduce((a,x)=>a+x.xd,0)+'/'+k*n]]);
 S.sort((a,b)=>SK==='id'?(a.s.id>b.s.id?1:-1)*SD:(a[SK]-b[SK])*SD);
 const H=[['id','นักศึกษา',''],['ws','ใบงาน','/'+n*WSM],['xs','สอบ','/'+n*EXM],['tot','รวม','/'+n*(WSM+EXM)]];
 $('#lst').innerHTML=`<div class="card" style="padding:4px 8px;overflow:auto"><table><tr>${H.map(([k,l,m])=>`<th onclick="SD=SK=='${k}'?-SD:1;SK='${k}';sumList()">${l}${SK===k?(SD>0?' ▲':' ▼'):''}<small>${m}</small></th>`).join('')}</tr>${S.map(x=>`<tr class="c" onclick="openG('${x.s.id}')"><td>${esc(x.s.name)}<br><span class="mu">${x.s.id} · ${esc(x.s.grp)}</span></td><td>${x.ws}${x.wp?`<span class="pd">รอ ${x.wp}</span>`:''}</td><td>${x.xs}</td><td><b style="color:${col(x.pct)}">${x.tot}</b><div class="bar" style="margin-top:3px"><i style="width:${x.pct}%;background:${col(x.pct)}"></i></div></td></tr>`).join('')||'<tr><td class="mu">ไม่พบข้อมูล</td></tr>'}</table></div>`}
function unitList(){const S=fl(),u=AUN;
 const sub=S.filter(s=>gw(s.id,u)),gr=sub.filter(s=>gw(s.id,u).score!=null),ex=S.filter(s=>gx(s.id,u));
 const avg=ex.length?(ex.reduce((a,s)=>a+gx(s.id,u).score,0)/ex.length).toFixed(1):'–';
 $('#stats').innerHTML=`<div class="unrow">${UL().map(k=>`<button class="un ${k==u?'sel':''}" onclick="AUN=${k};adminFill()">หน่วย ${k}</button>`).join('')}</div><div class="mu" style="margin:4px 0">${esc(UNITS[u-1])}</div>`+stBox([['ส่งแล้ว',sub.length+'/'+S.length],['ตรวจแล้ว',gr.length+'/'+sub.length],['สอบแล้ว',ex.length+'/'+S.length],['สอบเฉลี่ย',avg]]);
 $('#lst').innerHTML=`<div class="card" style="padding:4px 8px;overflow:auto"><table><tr><th>นักศึกษา</th><th>ใบงาน<small>/${WSM}</small></th><th>สอบ<small>/${EXM}</small></th></tr>${S.map(s=>{const w=gw(s.id,u),x=gx(s.id,u);return `<tr class="c" onclick="AG={s:'${s.id}',u:${u}};render()"><td>${esc(s.name)}<br><span class="mu">${s.id}</span></td><td>${!w?'<span class="mu">ยังไม่ส่ง</span>':w.score==null?'<span class="pd">รอตรวจ</span>':'<b>'+w.score+'</b>'}</td><td>${x?'<b>'+x.score+'</b>':'<span class="mu">–</span>'}</td></tr>`}).join('')}</table></div>`}
function pendList(){const p=pend();
 $('#lst').innerHTML=p.length?`<button class="btn" style="margin:0 0 8px" onclick="AG={s:'${p[0].student}',u:${p[0].unit}};render()">เริ่มตรวจต่อเนื่อง (${p.length} ชิ้น)</button><div class="card" style="padding:4px 8px">${p.map(w=>{const s=adm.students.find(x=>x.id==w.student);return `<div class="li" onclick="AG={s:'${w.student}',u:${w.unit}};render()"><span>${esc(s?s.name:w.student)}<br><span class="mu">${w.student}</span></span><span class="pd">หน่วย ${w.unit}</span></div>`}).join('')}</div>`:'<div class="card ok">ตรวจครบทุกชิ้นแล้ว ✓</div>'}
function openG(id){const us=UL(),u=us.find(k=>gw(id,k)&&gw(id,k).score==null)||us.find(k=>gw(id,k))||us[0];AG={s:id,u};render()}
function gradeV(){const s=adm.students.find(x=>x.id==AG.s),u=AG.u,w=gw(s.id,u),x=gx(s.id,u),q=C[u].ws,st=stat(s.id);
 const chips=UL().map(k=>{const a=gw(s.id,k);return `<button class="un ${k==u?'sel':''} ${a?(a.score==null?'wait':'done'):''}" onclick="AG.u=${k};render()">${k}</button>`}).join('');
 return `<button class="btn g" style="margin:0 0 8px" onclick="AG=null;render()">← กลับ</button>
<div class="card"><b>${esc(s.name)}</b><div class="mu">${s.id} · ${esc(s.grp)}</div>${stBox([['ใบงานรวม',st.ws],['สอบรวม',st.xs],['คะแนนรวม',st.tot+'/'+st.n*(WSM+EXM)]])}<div class="unrow" style="margin-top:8px">${chips}</div></div>
<div class="mu" style="margin:6px 2px">หน่วยที่ ${u} ${esc(UNITS[u-1])}</div>
${w?w.answers.map((a,i)=>`<div class="card"><div class="mu">ข้อ ${i+1}. ${esc(q[i]||'')}</div><p style="margin:6px 0 0;white-space:pre-wrap">${esc(a)}</p></div>`).join('')+`<div class="card"><b>ให้คะแนนใบงาน</b> <span class="mu">(เต็ม ${WSM})</span><div class="unrow" style="margin:8px 0">${[0,10,15,WSM].map(v=>`<button class="un" onclick="$('#sc').value=${v}">${v}</button>`).join('')}<input id="sc" type="number" min="0" max="${WSM}" value="${w.score??''}" style="width:90px;margin:0"></div><div class="row"><button class="btn" onclick="saveSc(0)">บันทึก</button><button class="btn" onclick="saveSc(1)">บันทึก + ถัดไป</button></div></div>`:'<div class="card mu">ยังไม่ส่งใบงานหน่วยนี้</div>'}
<div class="card">คะแนนสอบหน่วยนี้: ${x?`<b>${x.score}/${EXM}</b> <button class="chip" style="float:right" onclick="resetEx()">ให้สอบใหม่</button>`:'<span class="mu">ยังไม่สอบ</span>'}</div>`}
async function saveSc(next){const v=parseInt($('#sc').value);if(isNaN(v)||v<0||v>WSM){alert('คะแนนต้องอยู่ระหว่าง 0–'+WSM);return}
 try{await rpc('admin_score',{t:me.t,b:me.b,s:AG.s,u:AG.u,sc:v});await loadAdm();
  if(next){const p=pend()[0];if(p)AG={s:p.student,u:p.unit};else{AG=null;AT='pend'}}render()}catch(e){alert(e.message)}}
async function resetEx(){if(!confirm('ลบผลสอบหน่วยนี้ของนักศึกษา เพื่อให้สอบใหม่ได้?'))return;
 try{await rpc('admin_reset_exam',{t:me.t,b:me.b,s:AG.s,u:AG.u});await loadAdm();render()}catch(e){alert(e.message)}}
function exportCsv(){const us=UL(),h=['รหัส','ชื่อ','ห้อง',...us.flatMap(u=>['ใบงาน'+u,'สอบ'+u]),'รวมใบงาน','รวมสอบ','รวมทั้งหมด'];
 const r=adm.students.map(s=>{const t=stat(s.id);return [s.id,s.name,s.grp,...us.flatMap(u=>{const w=gw(s.id,u),x=gx(s.id,u);return [w?(w.score??'รอตรวจ'):'',x?x.score:'']}),t.ws,t.xs,t.tot]});
 const csv='\ufeff'+[h,...r].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='คะแนน-31900-1001.csv';a.click()}
render();
</script></body></html>
